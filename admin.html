<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理画面 - 静謐な執筆アーカイブ</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
            background-color: #22262a;
            color: rgba(255, 255, 255, 0.9);
        }
        .content-editor { min-height: 300px; line-height: 1.9; transition: outline-color 0.15s ease; }
        .content-editor:focus { outline: none; }
        .content-editor.drag-over { outline: 2px dashed rgba(255,255,255,0.5); outline-offset: -2px; }
        .content-editor img { max-width: 100%; height: auto; border-radius: 4px; margin: 1em 0; cursor: pointer; }
        .content-editor img.img-selected { outline: 2px solid rgba(255,255,255,0.6); outline-offset: 2px; }
        .content-editor blockquote { border-left: 2px solid rgba(255,255,255,0.3); padding-left: 1em; margin: 1em 0; opacity: 0.8; font-style: italic; }
        .content-editor h2 { font-size: 1.2em; margin: 1em 0 0.5em; }
        .article-preview { max-height: 3.2em; overflow: hidden; }
    </style>
</head>
<body class="min-h-screen">

    <!-- ログイン画面 -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-[#2f3438] border border-white/10 rounded-lg p-8 max-w-sm w-full">
            <h1 class="text-sm font-medium mb-1">断片 - 管理画面</h1>
            <p class="text-xs text-white/40 mb-6">執筆・編集にはログインが必要です</p>
            <input id="login-email" type="email" placeholder="メールアドレス" autocomplete="username" class="w-full bg-white/5 text-sm rounded px-3 py-2 border border-white/10 mb-3 focus:outline-none focus:border-white/30">
            <input id="login-password" type="password" placeholder="パスワード" autocomplete="current-password" class="w-full bg-white/5 text-sm rounded px-3 py-2 border border-white/10 mb-4 focus:outline-none focus:border-white/30" onkeydown="if(event.key==='Enter') submitLogin()">
            <div id="login-error" class="hidden text-xs mb-3" style="color:#e5697d;"></div>
            <button onclick="submitLogin()" class="w-full px-3 py-2 text-xs bg-white/10 hover:bg-white/20 rounded transition-colors">ログイン</button>
        </div>
    </div>

    <!-- アプリ本体(ログイン後) -->
    <div id="app-screen" class="hidden min-h-screen flex flex-col">
        <header class="border-b border-white/10 px-5 sm:px-8 py-3 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 shrink-0">
            <div class="flex items-center gap-4 sm:gap-6 flex-wrap">
                <h1 class="text-sm font-medium tracking-wide whitespace-nowrap">断片 - 管理画面</h1>
                <nav class="flex items-center gap-1 text-xs">
                    <button id="nav-articles" onclick="showTab('articles')" class="px-3 py-1.5 rounded transition-colors bg-white/10">記事</button>
                    <button id="nav-settings" onclick="showTab('settings')" class="px-3 py-1.5 rounded transition-colors hover:bg-white/10">表示設定</button>
                </nav>
            </div>
            <div class="flex items-center gap-4 text-xs">
                <a href="index.html" target="_blank" class="text-white/50 hover:text-white transition-colors">閲覧ビューを見る ↗</a>
                <button onclick="logout()" class="text-white/50 hover:text-white transition-colors">ログアウト</button>
            </div>
        </header>

        <!-- 記事一覧ビュー -->
        <div id="list-view" class="flex-1 overflow-y-auto">
            <div class="max-w-3xl mx-auto px-5 sm:px-8 py-8 sm:py-10">
                <button onclick="openNewEditor()" class="mb-8 w-full sm:w-auto px-5 py-3 text-sm bg-white/10 hover:bg-white/20 rounded transition-colors">＋ 新しい断片を書く</button>
                <div id="article-cards" class="flex flex-col gap-3"></div>
                <div id="empty-state" class="hidden text-xs text-white/40 text-center py-16">まだ断片がありません。「＋ 新しい断片を書く」から始めてください。</div>
            </div>
        </div>

        <!-- 編集ビュー -->
        <div id="editor-view" class="hidden flex-1 overflow-y-auto">
            <div class="max-w-3xl mx-auto px-5 sm:px-8 py-8 sm:py-10">
                <button onclick="backToList()" class="text-xs text-white/50 hover:text-white transition-colors mb-6">← 一覧に戻る</button>

                <div class="flex flex-col sm:flex-row gap-4 mb-6">
                    <div class="flex-1">
                        <label class="text-xs text-white/50 block mb-1">日付</label>
                        <input id="edit-date" type="text" placeholder="2024.01.01" class="w-full bg-white/5 text-sm rounded px-3 py-2 border border-white/10 focus:outline-none focus:border-white/30">
                    </div>
                    <div class="flex-[2]">
                        <label class="text-xs text-white/50 block mb-1">タイトル</label>
                        <input id="edit-title" type="text" placeholder="断片のタイトル" class="w-full bg-white/5 text-sm rounded px-3 py-2 border border-white/10 focus:outline-none focus:border-white/30">
                    </div>
                </div>

                <label class="text-xs text-white/50 block mb-1">本文</label>
                <div class="flex items-center flex-wrap gap-1 mb-2 bg-white/5 border border-white/10 rounded px-2 py-1 text-xs">
                    <button onclick="formatText('bold')" class="px-2 py-1 hover:bg-white/10 rounded transition-colors">太字</button>
                    <button onclick="formatText('italic')" class="px-2 py-1 hover:bg-white/10 rounded transition-colors">斜体</button>
                    <button onclick="formatText('formatBlock', 'H2')" class="px-2 py-1 hover:bg-white/10 rounded transition-colors">見出</button>
                    <button onclick="formatText('formatBlock', 'BLOCKQUOTE')" class="px-2 py-1 hover:bg-white/10 rounded transition-colors">引用</button>
                    <button onclick="formatText('formatBlock', 'P')" class="px-2 py-1 hover:bg-white/10 rounded transition-colors">本文</button>
                    <button onclick="insertImage()" class="px-2 py-1 hover:bg-white/10 rounded transition-colors">📷 写真を挿入</button>
                </div>
                <div id="edit-content" class="content-editor bg-white/5 border border-white/10 rounded px-4 py-3 text-sm" contenteditable="true"></div>
                <div id="image-resize-toolbar" class="hidden fixed z-50 bg-[#2f3438] border border-white/20 rounded shadow-lg px-2 py-1 flex items-center gap-1 text-xs">
                    <button onclick="resizeSelectedImage(25)" class="px-2 py-1 hover:bg-white/10 rounded transition-colors">25%</button>
                    <button onclick="resizeSelectedImage(50)" class="px-2 py-1 hover:bg-white/10 rounded transition-colors">50%</button>
                    <button onclick="resizeSelectedImage(75)" class="px-2 py-1 hover:bg-white/10 rounded transition-colors">75%</button>
                    <button onclick="resizeSelectedImage(100)" class="px-2 py-1 hover:bg-white/10 rounded transition-colors">100%</button>
                    <button onclick="resizeSelectedImage(null)" class="px-2 py-1 hover:bg-white/10 rounded transition-colors text-white/50">元に戻す</button>
                </div>

                <!-- この記事だけの文字組み -->
                <div class="mt-6 pt-6 border-t border-white/10">
                    <label class="flex items-center gap-2 text-xs text-white/70 mb-4">
                        <input type="checkbox" id="edit-override-typography" onchange="toggleTypographyOverride()">
                        この記事だけ文字組みを変える(オフの場合はサイト全体の表示設定に従います)
                    </label>
                    <div id="typography-override-fields" class="hidden flex flex-col gap-4 bg-white/5 border border-white/10 rounded p-4">
                        <div>
                            <label class="text-xs text-white/50 block mb-1">本文フォント</label>
                            <select id="edit-font" class="w-full bg-white/5 text-sm rounded px-3 py-2 border border-white/10 focus:outline-none focus:border-white/30">
                                <optgroup label="明朝体">
                                    <option value="'Shippori Mincho', serif">秀英明朝 (Shippori Mincho)</option>
                                    <option value="'Noto Serif JP', serif">Noto Serif JP</option>
                                    <option value="'Zen Old Mincho', serif">Zen Old Mincho</option>
                                    <option value="'Kaisei Tokumin', serif">Kaisei Tokumin</option>
                                </optgroup>
                                <optgroup label="ゴシック体">
                                    <option value="'Noto Sans JP', sans-serif">Noto Sans JP</option>
                                    <option value="'Zen Kaku Gothic New', sans-serif">Zen Kaku Gothic New</option>
                                    <option value="'Kosugi Maru', sans-serif">Kosugi Maru</option>
                                </optgroup>
                                <optgroup label="丸ゴシック体">
                                    <option value="'Zen Maru Gothic', sans-serif">Zen Maru Gothic</option>
                                    <option value="'M PLUS Rounded 1c', sans-serif">M PLUS Rounded 1c</option>
                                </optgroup>
                                <optgroup label="手書き風">
                                    <option value="'Klee One', cursive">Klee One</option>
                                </optgroup>
                            </select>
                        </div>
                        <div>
                            <div class="flex justify-between text-xs text-white/50 mb-1">
                                <span>文字サイズ</span><span id="edit-font-size-value"></span>
                            </div>
                            <input type="range" id="edit-font-size" min="10" max="40" step="1" class="w-full" oninput="document.getElementById('edit-font-size-value').textContent = this.value + 'px'">
                        </div>
                        <div>
                            <div class="flex justify-between text-xs text-white/50 mb-1">
                                <span>行間</span><span id="edit-line-height-value"></span>
                            </div>
                            <input type="range" id="edit-line-height" min="1.0" max="10" step="0.1" class="w-full" oninput="document.getElementById('edit-line-height-value').textContent = this.value">
                        </div>
                        <div>
                            <div class="flex justify-between text-xs text-white/50 mb-1">
                                <span>文字間隔</span><span id="edit-letter-spacing-value"></span>
                            </div>
                            <input type="range" id="edit-letter-spacing" min="-0.05" max="0.6" step="0.01" class="w-full" oninput="document.getElementById('edit-letter-spacing-value').textContent = this.value + 'em'">
                        </div>
                        <div>
                            <label class="text-xs text-white/50 block mb-1">文字揃え</label>
                            <select id="edit-text-align" class="w-full bg-white/5 text-sm rounded px-3 py-2 border border-white/10 focus:outline-none focus:border-white/30">
                                <option value="left">左揃え</option>
                                <option value="center">中央揃え</option>
                                <option value="right">右揃え</option>
                                <option value="justify">両端揃え</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="flex flex-wrap gap-3 mt-6">
                    <button onclick="saveArticle()" class="px-5 py-2.5 text-xs bg-white/10 hover:bg-white/20 rounded transition-colors">保存する</button>
                    <button onclick="backToList()" class="px-5 py-2.5 text-xs text-white/50 hover:text-white transition-colors">キャンセル</button>
                    <button id="delete-btn" onclick="deleteCurrentArticle()" class="hidden sm:ml-auto px-5 py-2.5 text-xs text-red-400/70 hover:text-red-400 transition-colors">この断片を削除</button>
                </div>
            </div>
        </div>

        <!-- 表示設定ビュー(サイト全体のデフォルト。読者は変更できない) -->
        <div id="settings-view" class="hidden flex-1 overflow-y-auto">
            <div class="max-w-lg mx-auto px-5 sm:px-8 py-8 sm:py-10">
                <h2 class="text-sm font-medium mb-1">表示設定</h2>
                <p class="text-xs text-white/40 mb-8">公開ページ全体の見た目のデフォルトです。保存すると全ての訪問者に反映されます。</p>

                <!-- タイトル -->
                <div class="mb-6 pb-6 border-b border-white/10">
                    <label class="text-xs text-white/50 block mb-2">ページタイトル(ブラウザのタブに表示される名前)</label>
                    <input id="set-page-title" type="text" placeholder="静謐な執筆アーカイブ" class="w-full bg-white/5 text-sm rounded px-3 py-2 border border-white/10 mb-4 focus:outline-none focus:border-white/30">
                    <label class="text-xs text-white/50 block mb-2">サイトタイトル(ページ上部の見出し)</label>
                    <input id="set-site-title" type="text" placeholder="断片" class="w-full bg-white/5 text-sm rounded px-3 py-2 border border-white/10 mb-4 focus:outline-none focus:border-white/30">
                    <label class="text-xs text-white/50 block mb-2">サブタイトル</label>
                    <input id="set-site-subtitle" type="text" placeholder="記憶の集積。言葉は静かに積もっていく。" class="w-full bg-white/5 text-sm rounded px-3 py-2 border border-white/10 focus:outline-none focus:border-white/30">
                </div>

                <!-- フォント -->
                <div class="mb-6">
                    <label class="text-xs text-white/50 block mb-2">本文フォント</label>
                    <select id="set-font" class="w-full bg-white/5 text-sm rounded px-3 py-2 border border-white/10 focus:outline-none focus:border-white/30">
                        <optgroup label="明朝体">
                            <option value="'Shippori Mincho', serif">秀英明朝 (Shippori Mincho)</option>
                            <option value="'Noto Serif JP', serif">Noto Serif JP</option>
                            <option value="'Zen Old Mincho', serif">Zen Old Mincho</option>
                            <option value="'Kaisei Tokumin', serif">Kaisei Tokumin</option>
                        </optgroup>
                        <optgroup label="ゴシック体">
                            <option value="'Noto Sans JP', sans-serif">Noto Sans JP</option>
                            <option value="'Zen Kaku Gothic New', sans-serif">Zen Kaku Gothic New</option>
                            <option value="'Kosugi Maru', sans-serif">Kosugi Maru</option>
                        </optgroup>
                        <optgroup label="丸ゴシック体">
                            <option value="'Zen Maru Gothic', sans-serif">Zen Maru Gothic</option>
                            <option value="'M PLUS Rounded 1c', sans-serif">M PLUS Rounded 1c</option>
                        </optgroup>
                        <optgroup label="手書き風">
                            <option value="'Klee One', cursive">Klee One</option>
                        </optgroup>
                    </select>
                </div>

                <!-- 文字組み -->
                <div class="mb-6 pb-6 border-b border-white/10">
                    <label class="text-xs text-white/50 block mb-3">文字組み</label>
                    <div class="flex flex-col gap-4">
                        <div>
                            <div class="flex justify-between text-xs text-white/50 mb-1">
                                <span>文字サイズ</span><span id="set-font-size-value"></span>
                            </div>
                            <input type="range" id="set-font-size" min="10" max="40" step="1" class="w-full" oninput="document.getElementById('set-font-size-value').textContent = this.value + 'px'">
                        </div>
                        <div>
                            <div class="flex justify-between text-xs text-white/50 mb-1">
                                <span>行間</span><span id="set-line-height-value"></span>
                            </div>
                            <input type="range" id="set-line-height" min="1.0" max="10" step="0.1" class="w-full" oninput="document.getElementById('set-line-height-value').textContent = this.value">
                        </div>
                        <div>
                            <div class="flex justify-between text-xs text-white/50 mb-1">
                                <span>文字間隔</span><span id="set-letter-spacing-value"></span>
                            </div>
                            <input type="range" id="set-letter-spacing" min="-0.05" max="0.6" step="0.01" class="w-full" oninput="document.getElementById('set-letter-spacing-value').textContent = this.value + 'em'">
                        </div>
                        <div>
                            <label class="text-xs text-white/50 block mb-1">文字揃え</label>
                            <select id="set-text-align" class="w-full bg-white/5 text-sm rounded px-3 py-2 border border-white/10 focus:outline-none focus:border-white/30">
                                <option value="left">左揃え</option>
                                <option value="center">中央揃え</option>
                                <option value="right">右揃え</option>
                                <option value="justify">両端揃え</option>
                            </select>
                        </div>
                        <div>
                            <div class="flex justify-between text-xs text-white/50 mb-1">
                                <span>頭出し行数(閉じているときに見える行数)</span><span id="set-preview-lines-value"></span>
                            </div>
                            <input type="range" id="set-preview-lines" min="1" max="20" step="1" class="w-full" oninput="document.getElementById('set-preview-lines-value').textContent = this.value + '行'">
                        </div>
                        <div>
                            <div class="flex justify-between text-xs text-white/50 mb-1">
                                <span>本文の表示幅</span><span id="set-content-width-value"></span>
                            </div>
                            <input type="range" id="set-content-width" min="280" max="1600" step="20" class="w-full" oninput="document.getElementById('set-content-width-value').textContent = this.value + 'px'">
                        </div>
                    </div>
                </div>

                <!-- 背景色 -->
                <div class="mb-6">
                    <label class="text-xs text-white/50 block mb-2">背景色</label>
                    <div class="flex gap-2 mb-3 items-center">
                        <input type="color" id="set-bg-color" class="w-12 h-12 rounded cursor-pointer" onchange="document.getElementById('set-bg-color-value').textContent = this.value; checkSetContrast()">
                        <span id="set-bg-color-value" class="text-xs text-white/50 font-mono"></span>
                    </div>
                    <div class="grid grid-cols-4 sm:grid-cols-6 gap-2">
                        <button onclick="pickColor('set-bg-color', '#6b7278')" class="h-8 rounded border border-white/10 hover:border-white/40" style="background-color:#6b7278;" title="石板色"></button>
                        <button onclick="pickColor('set-bg-color', '#2c3e50')" class="h-8 rounded border border-white/10 hover:border-white/40" style="background-color:#2c3e50;" title="深紺"></button>
                        <button onclick="pickColor('set-bg-color', '#1a1f24')" class="h-8 rounded border border-white/10 hover:border-white/40" style="background-color:#1a1f24;" title="漆黒"></button>
                        <button onclick="pickColor('set-bg-color', '#3d5a5d')" class="h-8 rounded border border-white/10 hover:border-white/40" style="background-color:#3d5a5d;" title="緑青"></button>
                        <button onclick="pickColor('set-bg-color', '#5a4a3a')" class="h-8 rounded border border-white/10 hover:border-white/40" style="background-color:#5a4a3a;" title="茶色"></button>
                        <button onclick="pickColor('set-bg-color', '#f5f2ea')" class="h-8 rounded border border-white/10 hover:border-white/40" style="background-color:#f5f2ea;" title="生成り(明)"></button>
                        <button onclick="pickColor('set-bg-color', '#ffffff')" class="h-8 rounded border border-white/10 hover:border-white/40" style="background-color:#ffffff;" title="白"></button>
                        <button onclick="pickColor('set-bg-color', '#e8e2d0')" class="h-8 rounded border border-white/10 hover:border-white/40" style="background-color:#e8e2d0;" title="砂紙"></button>
                        <button onclick="pickColor('set-bg-color', '#dfe6e0')" class="h-8 rounded border border-white/10 hover:border-white/40" style="background-color:#dfe6e0;" title="薄青磁"></button>
                    </div>
                </div>

                <!-- 文字色 -->
                <div class="mb-6">
                    <label class="text-xs text-white/50 block mb-2">文字色</label>
                    <div class="flex gap-2 mb-3 items-center">
                        <input type="color" id="set-text-color" class="w-12 h-12 rounded cursor-pointer" onchange="document.getElementById('set-text-color-value').textContent = this.value; checkSetContrast()">
                        <span id="set-text-color-value" class="text-xs text-white/50 font-mono"></span>
                    </div>
                    <div class="grid grid-cols-4 sm:grid-cols-6 gap-2">
                        <button onclick="pickColor('set-text-color', '#ffffff')" class="h-8 rounded border border-white/10 hover:border-white/40" style="background-color:#ffffff;" title="白"></button>
                        <button onclick="pickColor('set-text-color', '#e8e4d8')" class="h-8 rounded border border-white/10 hover:border-white/40" style="background-color:#e8e4d8;" title="生成り"></button>
                        <button onclick="pickColor('set-text-color', '#d4c9a8')" class="h-8 rounded border border-white/10 hover:border-white/40" style="background-color:#d4c9a8;" title="砂色"></button>
                        <button onclick="pickColor('set-text-color', '#111111')" class="h-8 rounded border border-white/10 hover:border-white/40" style="background-color:#111111;" title="漆黒"></button>
                        <button onclick="pickColor('set-text-color', '#3a2f28')" class="h-8 rounded border border-white/10 hover:border-white/40" style="background-color:#3a2f28;" title="焦茶"></button>
                    </div>
                    <div id="set-contrast-warning" class="hidden text-xs mt-3 leading-relaxed" style="color:#f0b429;">⚠ 背景色とのコントラストが低く、文字が読みにくくなっています</div>
                </div>

                <div class="flex gap-3 pt-4 border-t border-white/10">
                    <button onclick="saveSiteSettings()" class="px-5 py-2.5 text-xs bg-white/10 hover:bg-white/20 rounded transition-colors">保存する</button>
                    <a href="index.html" target="_blank" class="px-5 py-2.5 text-xs text-white/50 hover:text-white transition-colors">閲覧ビューで確認 ↗</a>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-white/10 backdrop-blur-md px-6 py-2 rounded-full text-xs opacity-0 transition-opacity duration-500 pointer-events-none z-50">保存されました</div>

    <script>
        const SUPABASE_URL = 'https://eiyzlawmcyybchxzyozr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpeXpsYXdtY3l5YmNoeHp5b3pyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMDI2MjQsImV4cCI6MjA5NTU3ODYyNH0.SZVwqWKkk31npqdiiG5m3HdkF4JnQ7SgEzThaFfZ4q4';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const IMAGE_BUCKET = 'article-images';

        let articles = [];
        let editingId = null;

        function showToast(msg) {
            const t = document.getElementById('toast'); t.textContent = msg; t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2000);
        }

        // --- 認証 ---
        async function checkAuth() {
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                showApp();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
            }
        }

        async function submitLogin() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const { error } = await sb.auth.signInWithPassword({ email, password });
            if (error) {
                const el = document.getElementById('login-error');
                el.textContent = 'ログインに失敗しました: ' + error.message;
                el.classList.remove('hidden');
                return;
            }
            showApp();
        }

        async function logout() {
            await sb.auth.signOut();
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('hidden');
        }

        function showApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            showTab('articles');
        }

        // --- タブ切り替え(記事 / 表示設定) ---
        function showTab(tab) {
            document.getElementById('nav-articles').classList.toggle('bg-white/10', tab === 'articles');
            document.getElementById('nav-settings').classList.toggle('bg-white/10', tab === 'settings');
            document.getElementById('settings-view').classList.toggle('hidden', tab !== 'settings');
            if (tab === 'articles') {
                showListView();
                loadArticleList();
            } else {
                document.getElementById('list-view').classList.add('hidden');
                document.getElementById('editor-view').classList.add('hidden');
                loadSiteSettings();
            }
        }

        // --- 一覧 ---
        function stripHtml(html) {
            const div = document.createElement('div');
            div.innerHTML = html;
            return (div.textContent || '').trim();
        }

        async function loadArticleList() {
            const { data, error } = await sb.from('articles').select('*').order('date', { ascending: false }).order('id', { ascending: false });
            if (error) {
                console.error(error);
                showToast('読み込みに失敗しました');
                return;
            }
            articles = data || [];
            renderArticleCards();
        }

        function renderArticleCards() {
            const container = document.getElementById('article-cards');
            container.innerHTML = '';
            document.getElementById('empty-state').classList.toggle('hidden', articles.length > 0);
            articles.forEach(article => {
                const preview = stripHtml(article.content).slice(0, 70);
                const card = document.createElement('div');
                card.className = 'flex items-center gap-4 bg-white/5 hover:bg-white/10 border border-white/10 rounded px-4 py-3 cursor-pointer transition-colors';
                card.onclick = () => openEditEditor(article.id);
                card.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <div class="text-xs text-white/40 mb-1">${article.date}</div>
                        <div class="text-sm mb-1 truncate">${article.title || '(無題)'}</div>
                        <div class="text-xs text-white/40 truncate">${preview}</div>
                    </div>
                    <span class="text-xs text-white/30">編集 →</span>
                `;
                container.appendChild(card);
            });
        }

        function showListView() {
            document.getElementById('list-view').classList.remove('hidden');
            document.getElementById('editor-view').classList.add('hidden');
        }

        function showEditorView() {
            document.getElementById('list-view').classList.add('hidden');
            document.getElementById('editor-view').classList.remove('hidden');
        }

        function backToList() {
            showListView();
            loadArticleList();
        }

        // --- 編集 ---
        function todayString() {
            const d = new Date();
            return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
        }

        const TYPOGRAPHY_DEFAULTS = { font: "'Shippori Mincho', serif", font_size: 16, line_height: 2.2, letter_spacing: 0.08, text_align: 'left' };

        function toggleTypographyOverride() {
            document.getElementById('typography-override-fields').classList.toggle('hidden', !document.getElementById('edit-override-typography').checked);
        }

        function setTypographyFields(values) {
            document.getElementById('edit-font').value = values.font;
            document.getElementById('edit-font-size').value = values.font_size;
            document.getElementById('edit-font-size-value').textContent = values.font_size + 'px';
            document.getElementById('edit-line-height').value = values.line_height;
            document.getElementById('edit-line-height-value').textContent = values.line_height;
            document.getElementById('edit-letter-spacing').value = values.letter_spacing;
            document.getElementById('edit-letter-spacing-value').textContent = values.letter_spacing + 'em';
            document.getElementById('edit-text-align').value = values.text_align || 'left';
        }

        function openNewEditor() {
            editingId = null;
            document.getElementById('edit-date').value = todayString();
            document.getElementById('edit-title').value = '';
            document.getElementById('edit-content').innerHTML = '<p></p>';
            document.getElementById('delete-btn').classList.add('hidden');
            document.getElementById('edit-override-typography').checked = false;
            setTypographyFields(TYPOGRAPHY_DEFAULTS);
            toggleTypographyOverride();
            showEditorView();
            document.getElementById('edit-title').focus();
        }

        function openEditEditor(id) {
            const article = articles.find(a => a.id === id);
            if (!article) return;
            editingId = article.id;
            document.getElementById('edit-date').value = article.date;
            document.getElementById('edit-title').value = article.title;
            document.getElementById('edit-content').innerHTML = article.content;
            document.getElementById('delete-btn').classList.remove('hidden');

            const hasOverride = article.font != null;
            document.getElementById('edit-override-typography').checked = hasOverride;
            setTypographyFields(hasOverride ? article : TYPOGRAPHY_DEFAULTS);
            toggleTypographyOverride();

            showEditorView();
        }

        async function saveArticle() {
            const date = document.getElementById('edit-date').value.trim();
            const title = document.getElementById('edit-title').value.trim();
            const content = document.getElementById('edit-content').innerHTML;

            if (!date || !title) {
                showToast('日付とタイトルを入力してください');
                return;
            }

            const useOverride = document.getElementById('edit-override-typography').checked;
            const payload = {
                date, title, content,
                font: useOverride ? document.getElementById('edit-font').value : null,
                font_size: useOverride ? Number(document.getElementById('edit-font-size').value) : null,
                line_height: useOverride ? Number(document.getElementById('edit-line-height').value) : null,
                letter_spacing: useOverride ? Number(document.getElementById('edit-letter-spacing').value) : null,
                text_align: useOverride ? document.getElementById('edit-text-align').value : null
            };
            const { error } = editingId
                ? await sb.from('articles').update(payload).eq('id', editingId)
                : await sb.from('articles').insert(payload);

            if (error) {
                console.error(error);
                showToast('保存に失敗しました');
                return;
            }
            showToast('保存しました');
            backToList();
        }

        async function deleteCurrentArticle() {
            if (!editingId) return;
            if (!confirm('この断片を削除しますか？元に戻せません。')) return;
            const { error } = await sb.from('articles').delete().eq('id', editingId);
            if (error) {
                console.error(error);
                showToast('削除に失敗しました');
                return;
            }
            showToast('削除しました');
            backToList();
        }

        // --- 本文フォーマット・画像挿入 ---
        function formatText(cmd, val = null) {
            document.getElementById('edit-content').focus();
            document.execCommand(cmd, false, val);
        }

        async function uploadImageFile(file) {
            const path = `${Date.now()}-${file.name}`;
            const { error: uploadError } = await sb.storage.from(IMAGE_BUCKET).upload(path, file);
            if (uploadError) {
                console.error(uploadError);
                showToast('アップロードに失敗しました');
                return null;
            }
            const { data } = sb.storage.from(IMAGE_BUCKET).getPublicUrl(path);
            return data.publicUrl;
        }

        function insertImage() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = async () => {
                const file = input.files[0];
                if (!file) return;
                showToast('アップロード中...');
                const url = await uploadImageFile(file);
                if (url) {
                    formatText('insertImage', url);
                    showToast('画像を挿入しました');
                }
            };
            input.click();
        }

        // ドロップされた位置にキャレットを合わせる(対応していないブラウザでは末尾に挿入される)
        function placeCaretAtPoint(x, y) {
            let range = null;
            if (document.caretRangeFromPoint) {
                range = document.caretRangeFromPoint(x, y);
            } else if (document.caretPositionFromPoint) {
                const pos = document.caretPositionFromPoint(x, y);
                if (pos) {
                    range = document.createRange();
                    range.setStart(pos.offsetNode, pos.offset);
                    range.collapse(true);
                }
            }
            if (range) {
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
            }
        }

        function setupImageDropZone() {
            const editor = document.getElementById('edit-content');
            editor.addEventListener('dragover', (e) => {
                e.preventDefault();
                editor.classList.add('drag-over');
            });
            editor.addEventListener('dragleave', () => {
                editor.classList.remove('drag-over');
            });
            editor.addEventListener('drop', async (e) => {
                e.preventDefault();
                editor.classList.remove('drag-over');
                const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
                if (!files.length) return;
                editor.focus();
                placeCaretAtPoint(e.clientX, e.clientY);
                showToast('アップロード中...');
                for (const file of files) {
                    const url = await uploadImageFile(file);
                    if (url) document.execCommand('insertImage', false, url);
                }
                showToast('画像を挿入しました');
            });
        }

        // --- 画像のサイズ変更 ---
        let selectedImage = null;

        function setupImageResize() {
            const editor = document.getElementById('edit-content');
            editor.addEventListener('click', (e) => {
                if (e.target.tagName === 'IMG') {
                    selectImage(e.target);
                } else {
                    deselectImage();
                }
            });
            document.addEventListener('click', (e) => {
                if (!e.target.closest('#image-resize-toolbar') && e.target.tagName !== 'IMG') {
                    deselectImage();
                }
            });
        }

        function selectImage(img) {
            if (selectedImage) selectedImage.classList.remove('img-selected');
            selectedImage = img;
            selectedImage.classList.add('img-selected');
            const toolbar = document.getElementById('image-resize-toolbar');
            const rect = img.getBoundingClientRect();
            toolbar.style.top = Math.max(rect.top - 44, 8) + 'px';
            toolbar.style.left = rect.left + 'px';
            toolbar.classList.remove('hidden');
        }

        function deselectImage() {
            if (selectedImage) selectedImage.classList.remove('img-selected');
            selectedImage = null;
            document.getElementById('image-resize-toolbar').classList.add('hidden');
        }

        function resizeSelectedImage(percent) {
            if (!selectedImage) return;
            if (percent === null) {
                selectedImage.style.width = '';
                selectedImage.style.height = '';
            } else {
                selectedImage.style.width = percent + '%';
                selectedImage.style.height = 'auto';
            }
        }

        // --- 表示設定(サイト全体のデフォルト) ---
        function pickColor(inputId, value) {
            const input = document.getElementById(inputId);
            input.value = value;
            input.dispatchEvent(new Event('change'));
        }

        function hexToRgb(hex) {
            const h = hex.replace('#', '');
            const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
            const n = parseInt(full, 16);
            return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
        }

        function relativeLuminance({ r, g, b }) {
            const [R, G, B] = [r, g, b].map(v => {
                v /= 255;
                return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
            });
            return 0.2126 * R + 0.7152 * G + 0.0722 * B;
        }

        function contrastRatio(hex1, hex2) {
            const L1 = relativeLuminance(hexToRgb(hex1));
            const L2 = relativeLuminance(hexToRgb(hex2));
            const [light, dark] = L1 > L2 ? [L1, L2] : [L2, L1];
            return (light + 0.05) / (dark + 0.05);
        }

        function checkSetContrast() {
            const bg = document.getElementById('set-bg-color').value;
            const fg = document.getElementById('set-text-color').value;
            document.getElementById('set-contrast-warning').classList.toggle('hidden', contrastRatio(bg, fg) >= 3);
        }

        async function loadSiteSettings() {
            const { data, error } = await sb.from('site_settings').select('*').eq('id', 1).single();
            if (error || !data) {
                console.error(error);
                showToast('表示設定の読み込みに失敗しました');
                return;
            }
            document.getElementById('set-page-title').value = data.page_title || '';
            document.getElementById('set-site-title').value = data.site_title || '';
            document.getElementById('set-site-subtitle').value = data.site_subtitle || '';
            document.getElementById('set-font').value = data.font;
            document.getElementById('set-font-size').value = data.font_size;
            document.getElementById('set-font-size-value').textContent = data.font_size + 'px';
            document.getElementById('set-line-height').value = data.line_height;
            document.getElementById('set-line-height-value').textContent = data.line_height;
            document.getElementById('set-letter-spacing').value = data.letter_spacing;
            document.getElementById('set-letter-spacing-value').textContent = data.letter_spacing + 'em';
            document.getElementById('set-text-align').value = data.text_align || 'left';
            document.getElementById('set-preview-lines').value = data.preview_lines;
            document.getElementById('set-preview-lines-value').textContent = data.preview_lines + '行';
            document.getElementById('set-content-width').value = data.content_width;
            document.getElementById('set-content-width-value').textContent = data.content_width + 'px';
            document.getElementById('set-bg-color').value = data.bg_color;
            document.getElementById('set-bg-color-value').textContent = data.bg_color;
            document.getElementById('set-text-color').value = data.text_color;
            document.getElementById('set-text-color-value').textContent = data.text_color;
            checkSetContrast();
        }

        async function saveSiteSettings() {
            const payload = {
                page_title: document.getElementById('set-page-title').value.trim(),
                site_title: document.getElementById('set-site-title').value.trim(),
                site_subtitle: document.getElementById('set-site-subtitle').value.trim(),
                bg_color: document.getElementById('set-bg-color').value,
                text_color: document.getElementById('set-text-color').value,
                font: document.getElementById('set-font').value,
                font_size: Number(document.getElementById('set-font-size').value),
                line_height: Number(document.getElementById('set-line-height').value),
                letter_spacing: Number(document.getElementById('set-letter-spacing').value),
                text_align: document.getElementById('set-text-align').value,
                preview_lines: Number(document.getElementById('set-preview-lines').value),
                content_width: Number(document.getElementById('set-content-width').value)
            };
            const { error } = await sb.from('site_settings').update(payload).eq('id', 1);
            if (error) {
                console.error(error);
                showToast('保存に失敗しました');
                return;
            }
            showToast('表示設定を保存しました');
        }

        setupImageDropZone();
        setupImageResize();
        checkAuth();
    </script>
</body>
</html>
