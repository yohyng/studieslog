<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>fragments</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="fragments">
    <meta property="og:description" content="建築・空間・デザインをめぐる思索、試論">
    <meta property="og:image" content="/api/og-image">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="manifest" href="/icons/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#f3f2f2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="fragments">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Lora:ital,wght@0,400;1,400&family=Shippori+Mincho:wght@400;500&family=Zen+Old+Mincho:wght@400&display=swap" rel="stylesheet">

    <style>
        /* ── Design tokens ─────────────────────────── */
        :root {
            --bg:      #f3f2f2;
            --text:    #201f1d;
            --accent:  #0000ff;
            --accent-h:#0000d8;
            --a100:    #e8e8ff;
            --a900:    #000080;
            --n700:    #605d5d;
            --n800:    #444141;
            --n500:    #9b9797;
            --n400:    #bab6b6;
            --divider: color-mix(in srgb, #201f1d 16%, transparent);
        }
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Zen Old Mincho', serif;
            -webkit-font-smoothing: antialiased;
        }
        a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
        a:hover { color: var(--accent-h); }
        ::selection { background: var(--accent); color: #fff; }
        button { cursor: pointer; background: none; border: 0; padding: 0; font: inherit; }

        /* ── App shell ─────────────────────────────── */
        #app {
            height: 100dvh;
            overflow: hidden;
            display: grid;
            grid-template-columns: 360px minmax(0, 1fr);
            column-gap: 56px;
            padding: 48px 32px 32px;
        }

        /* ── Column scroll wrappers ─────────────────── */
        .col-wrap {
            position: relative;
            height: 100%;
            overflow: hidden;
        }
        .col {
            height: 100%;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .col::-webkit-scrollbar { display: none; }

        /* ── Custom scrollbar ─────────────────────── */
        .sb {
            position: absolute;
            top: 0;
            right: 0;
            width: 1px;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .sb-thumb {
            position: absolute;
            width: 1px;
            background: var(--n500);
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .sb-thumb.showing { opacity: 1; transition: opacity 0.2s ease; }

        /* ── End rule ─────────────────────────────── */
        .end-rule {
            position: sticky;
            bottom: 0;
            height: 0;
            border-top: 1px solid var(--n700);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        .col.at-end .end-rule { opacity: 1; }
        /* about page end rule always visible */
        .end-rule.always { opacity: 1; }

        /* ── Left column ──────────────────────────── */
        #left-col {
            display: flex;
            flex-direction: column;
            gap: 22px;
            padding-bottom: 96px;
        }

        /* Site name — sticky */
        #left-head {
            position: sticky;
            top: 0;
            z-index: 1;
            background: var(--bg);
        }
        #site-name {
            display: block;
            font-family: 'Cormorant Garamond', serif;
            font-size: 30px;
            line-height: 1.2;
            padding-bottom: 6px;
            color: var(--text);
            text-decoration: none;
            border-bottom: 1px solid var(--n700);
        }
        #site-name:hover { color: var(--text); }

        /* Description block */
        #site-desc {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 222px;
            box-sizing: border-box;
            padding-top: 34px;
            font-size: 13px;
            line-height: 1.75;
            color: var(--n800);
        }
        #site-desc .ja { font-family: 'Zen Old Mincho', serif; }
        #site-desc .en { font-family: 'Lora', serif; font-style: italic; }

        /* Category nav */
        #cat-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 14px;
            margin-top: auto;
            padding-top: 14px;
        }
        .cat-btn {
            font-family: 'Lora', serif;
            font-size: 13px;
            line-height: 1.6;
            color: var(--n800);
            border-bottom: 1px solid transparent;
        }
        .cat-btn:hover { color: var(--accent-h); }
        .cat-btn.on { color: var(--accent); border-bottom-color: var(--accent); }

        /* Article list */
        #article-list { display: flex; flex-direction: column; }
        .list-item {
            display: block;
            padding: 3px 0;
            text-decoration: none;
            color: var(--text);
            font-size: 13px;
            line-height: 1.75;
        }
        .list-item:hover { color: var(--accent); }
        .list-item.on { color: var(--accent); }
        .list-item.dim .i-row1,
        .list-item.dim .i-sub,
        .list-item.dim .i-date { color: var(--n400); }
        .i-row1 {
            display: block;
            font-family: 'Zen Old Mincho', serif;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .i-sub { margin-left: 8px; color: var(--n700); }
        .i-date {
            display: block;
            font-family: 'Lora', serif;
            font-size: 10.5px;
            line-height: 1.5;
            color: var(--n700);
            font-variant-numeric: tabular-nums;
        }

        /* Load-more button */
        #load-more {
            text-align: left;
            padding: 10px 0 6px;
            border-top: 1px solid var(--divider);
            font-family: 'Zen Old Mincho', serif;
            font-size: 13px;
            color: var(--n500);
            margin-top: 4px;
        }
        #load-more:hover { color: var(--n700); }

        /* Left footer */
        #left-foot {
            display: flex;
            flex-direction: column;
            font-family: 'Zen Old Mincho', serif;
            font-size: 13px;
            line-height: 1.75;
        }
        #left-foot .about-lnk { color: var(--text); text-decoration: none; }
        #left-foot .about-lnk:hover { color: var(--accent-h); }
        #left-foot .sub-lnk { color: var(--accent); text-decoration: none; }
        #left-foot .sub-lnk:hover { color: var(--accent-h); }

        /* ── Right column ─────────────────────────── */
        #right-col { padding-bottom: 0; }

        /* Right sticky header — empty on PC, matches left header height */
        #right-head {
            position: sticky;
            top: 0;
            z-index: 1;
            background: var(--bg);
            height: 36px;
            padding-bottom: 6px;
            box-sizing: content-box;
            border-bottom: 1px solid var(--n700);
        }
        /* On tablet/mobile, right-head holds the back link */
        .back-lnk {
            display: block;
            font-family: 'Cormorant Garamond', serif;
            color: var(--text);
            text-decoration: none;
            line-height: 1.2;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--n700);
        }
        .back-lnk:hover { color: var(--text); }

        /* ── Article view ─────────────────────────── */
        #art-view { display: none; }
        #art-head {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-top: 56px;
            min-height: 220px;
            box-sizing: border-box;
        }
        #art-h1 {
            font-family: 'Shippori Mincho', serif;
            font-weight: 500;
            font-size: clamp(26px, 1.4rem + 0.6vw, 32px);
            line-height: 1.4;
            letter-spacing: 0.02em;
            margin: 0;
            color: var(--text);
        }
        #art-sub {
            font-family: 'Shippori Mincho', serif;
            font-size: 17px;
            line-height: 1.6;
            color: var(--n800);
        }
        #art-date {
            font-family: 'Lora', serif;
            font-size: 12px;
            color: var(--n700);
            font-variant-numeric: tabular-nums;
            margin-top: 10px;
        }

        /* Article body typography */
        .art-body {
            max-width: 34em;
            font-family: 'Zen Old Mincho', serif;
            font-size: clamp(15px, 0.8rem + 0.2vw, 16px);
            line-height: 1.9;
            text-align: justify;
            letter-spacing: 0.02em;
        }
        .art-body p { margin: 0; text-indent: 1em; }
        .art-body h2 {
            font-family: 'Shippori Mincho', serif;
            font-weight: 500;
            font-size: 22px;
            line-height: 1.5;
            letter-spacing: 0.02em;
            margin: 2.2em 0 0.8em;
        }
        .art-body h3 {
            font-family: 'Shippori Mincho', serif;
            font-weight: 500;
            font-size: 17px;
            line-height: 1.6;
            margin: 1.8em 0 0.4em;
        }
        .art-body blockquote {
            margin: 2em 0;
            padding: 2px 0 2px 1.5em;
            border-left: 1px solid var(--accent);
            color: var(--n800);
        }
        .art-body blockquote cite {
            display: block;
            margin-top: 8px;
            font-style: normal;
            font-size: 12px;
            color: var(--n700);
        }
        .art-body figure { margin: 2.2em 0; }
        .art-body figcaption {
            margin-top: 10px;
            font-size: 12px;
            line-height: 1.7;
            color: var(--n700);
            text-align: left;
        }
        .art-body img {
            max-width: 100%;
            border: 6px solid #eae9e9;
            outline: 1px solid var(--divider);
        }
        .art-body ul, .art-body ol {
            margin: 1.6em 0;
            padding-left: 1.4em;
            text-indent: 0;
        }
        .art-body li { margin: 0; }
        .art-body a { text-decoration: underline; }
        /* Footnote superscripts */
        .art-body sup a,
        .art-body sup {
            font-family: 'Lora', serif;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-indent: 0;
            min-width: 15px;
            height: 15px;
            padding: 0 3px;
            box-sizing: border-box;
            font-size: 10px;
            line-height: 1;
            color: #fff;
            font-variant-numeric: tabular-nums;
            border-radius: 1px;
            margin: 0 2px;
            vertical-align: 4px;
            background: var(--accent);
            text-decoration: none;
        }
        .art-body sup a:hover,
        .art-body sup:hover { background: var(--a900); }

        /* Article footer */
        .art-foot {
            max-width: calc(34 * clamp(15px, 0.8rem + 0.2vw, 16px));
        }

        /* Subscribe form */
        .sub-wrap {
            margin-top: 96px;
            padding: 48px 0 12px;
            border-top: 1px solid var(--text);
            font-family: 'Zen Old Mincho', serif;
            font-size: 14px;
        }
        .sub-row {
            display: flex;
            height: 34px;
            border: 1px solid var(--accent);
        }
        .sub-email-in {
            flex: 1;
            min-width: 0;
            height: 100%;
            padding: 0 12px;
            font-family: 'Lora', 'Zen Old Mincho', serif;
            font-size: 14px;
            color: var(--text);
            background: transparent;
            border: 0;
            outline: none;
        }
        .sub-email-in::placeholder {
            font-size: 12px;
            color: var(--n500);
        }
        .sub-email-in:focus { box-shadow: inset 0 0 0 0.5px var(--accent); }
        .sub-go {
            flex: none;
            display: flex;
            align-items: center;
            padding: 0 14px;
            font-family: 'Lora', serif;
            font-size: 13px;
            color: #fff;
            background: var(--accent);
        }
        .sub-go:hover { background: var(--accent-h); }
        .sub-ok { display: none; flex-direction: column; gap: 4px; }
        .sub-ok-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 34px;
            padding: 0 12px;
            border: 1px solid var(--accent);
            background: var(--a100);
            font-family: 'Lora', serif;
            font-size: 13px;
            color: var(--accent);
        }
        .sub-ok-check {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            background: var(--accent);
            color: #fff;
            font-size: 11px;
            line-height: 1;
        }
        .sub-ok-msg { font-size: 11.5px; line-height: 1.7; color: var(--n700); }

        /* Prev/next nav */
        .art-nav {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 24px;
            margin-top: 40px;
            font-family: 'Zen Old Mincho', serif;
            font-size: 13px;
            line-height: 1.75;
        }
        .art-nav a { display: flex; flex-direction: column; color: var(--text); text-decoration: none; }
        .art-nav a:hover { color: var(--accent); }
        .art-nav .nxt { align-items: flex-end; text-align: right; }
        .nav-lbl { font-family: 'Lora', serif; font-size: 11.5px; color: var(--n700); }

        /* Related articles */
        .art-rel { display: flex; flex-direction: column; margin-top: 48px; }
        .rel-lbl { font-family: 'Lora', serif; font-size: 11px; color: var(--n700); padding-bottom: 6px; }
        .rel-item {
            display: block;
            padding: 6px 0;
            font-family: 'Zen Old Mincho', serif;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text);
            text-decoration: none;
        }
        .rel-item:hover { color: var(--accent); }
        .rel-item span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rel-date { font-family: 'Lora', serif; font-size: 11px; color: var(--n700); font-variant-numeric: tabular-nums; }

        /* ── About view ───────────────────────────── */
        #about-view {
            display: none;
            flex-direction: column;
            min-height: 100%;
        }
        #about-cont {
            padding-top: 56px;
            min-height: 220px;
            box-sizing: border-box;
            flex: 1;
        }
        #about-h1 {
            font-family: 'Shippori Mincho', serif;
            font-weight: 500;
            font-size: 30px;
            line-height: 1.4;
            margin: 0 0 56px;
        }
        .about-grid {
            display: grid;
            grid-template-columns: minmax(0, 34em) 300px;
            column-gap: 88px;
        }
        .about-text {
            display: flex;
            flex-direction: column;
            gap: 20px;
            font-size: clamp(15px, 0.8rem + 0.2vw, 16px);
            line-height: 1.9;
        }
        .about-text p { margin: 0; }
        .about-catch {
            font-family: 'Shippori Mincho', serif;
            font-size: 18px;
            line-height: 1.7;
        }
        .about-catch-en {
            font-family: 'Lora', serif;
            font-style: italic;
            font-size: 16px;
            line-height: 1.6;
            color: var(--n800);
        }
        .about-desc {
            font-family: 'Zen Old Mincho', serif;
            text-align: justify;
            color: var(--n800);
            padding-top: 20px;
            border-top: 1px solid var(--divider);
        }
        .about-contact {
            display: flex;
            flex-direction: column;
            gap: 14px;
            font-family: 'Zen Old Mincho', serif;
            font-size: 12px;
            line-height: 1.75;
            color: var(--n800);
        }
        .about-contact-lbl { font-family: 'Lora', serif; font-size: 11px; color: var(--n700); }
        .about-contact a { color: var(--text); text-decoration: none; display: block; }
        .about-contact a:hover { color: var(--accent); }

        /* ── Tablet (760–1199px) ──────────────────── */
        @media (min-width: 760px) and (max-width: 1199px) {
            #app {
                display: block;
                height: 100dvh;
                overflow: hidden;
                padding: 40px 36px 64px;
            }
            #left-wrap { width: 340px; height: 100%; }
            #right-wrap {
                display: none;
                position: fixed;
                inset: 0;
                background: var(--bg);
                z-index: 10;
                padding: 40px 36px 64px;
            }
            #right-wrap.open { display: block; }
            #right-col.col { height: 100%; }
            #site-name { font-size: 28px; }
            .back-lnk { font-size: 28px; }
            .art-body { max-width: 30em; }
            #art-h1 { font-size: 28px; }
            .art-foot { max-width: calc(30 * clamp(15px, 0.8rem + 0.2vw, 16px)); }
        }

        /* ── Mobile (≤759px) ──────────────────────── */
        @media (max-width: 759px) {
            #app {
                display: block;
                height: auto;
                overflow: visible;
                padding: 32px 20px 44px;
            }
            #left-wrap, #right-wrap { position: static; display: block; height: auto; }
            #left-wrap .col, #right-wrap .col {
                height: auto;
                overflow: visible;
            }
            .sb { display: none; }
            .end-rule { display: none; }
            #right-wrap { display: none; }
            #right-wrap.open { display: block; }
            #left-wrap.hidden { display: none; }
            #site-name { font-size: 26px; }
            .back-lnk { font-size: 22px; }
            #right-head { height: auto; border-bottom: 0; }
            #site-desc { min-height: auto; padding-top: 20px; }
            #cat-nav {
                flex-wrap: nowrap;
                overflow-x: auto;
                scrollbar-width: none;
                gap: 0 18px;
                padding-top: 0;
                margin-top: 0;
            }
            #cat-nav::-webkit-scrollbar { display: none; }
            .cat-btn { font-size: 14px; padding: 12px 0 8px; }
            #left-col { gap: 20px; padding-bottom: 48px; }
            .list-item { padding: 9px 0; font-size: 14px; }
            .i-date { font-size: 11px; }
            #left-foot { flex-direction: row; gap: 24px; }
            #left-foot .about-lnk,
            #left-foot .sub-lnk { padding: 12px 0; }
            #art-head { padding-top: 40px; min-height: auto; }
            #art-h1 { font-size: 24px; }
            #art-sub { font-size: 15px; }
            .sub-email-in { font-size: 16px; } /* prevent iOS zoom */
            .about-grid { grid-template-columns: 1fr; column-gap: 0; }
            .about-contact { margin-top: 24px; }
        }
    </style>
</head>
<body>
<div id="app">
    <!-- ── Left wrap ──────────────────────────────── -->
    <div id="left-wrap" class="col-wrap">
        <div id="left-col" class="col">
            <div id="left-head">
                <a id="site-name" href="/">fragments</a>
            </div>
            <div id="site-desc">
                <span class="ja">建築・空間・デザインをめぐる思索、試論 /</span>
                <span class="en">Explorations and Abductive Speculations on Architecture, Space, and Design.</span>
                <div id="cat-nav">
                    <button class="cat-btn on" data-cat="">all</button>
                    <button class="cat-btn" data-cat="essay">essay</button>
                    <button class="cat-btn" data-cat="days">days</button>
                    <button class="cat-btn" data-cat="books">books</button>
                    <button class="cat-btn" data-cat="spaces">spaces</button>
                </div>
            </div>
            <div id="article-list"></div>
            <button id="load-more" style="display:none">さらに読み込む</button>
            <div id="left-foot">
                <a class="about-lnk" id="about-lnk" href="/about">about</a>
                <a class="sub-lnk" id="sub-nav-lnk" href="#">subscribe</a>
            </div>
            <div class="end-rule" id="left-end-rule"></div>
        </div>
        <div class="sb"><div class="sb-thumb" id="left-sb"></div></div>
    </div>

    <!-- ── Right wrap ─────────────────────────────── -->
    <div id="right-wrap" class="col-wrap">
        <div id="right-col" class="col">
            <div id="right-head"></div>

            <!-- Article view -->
            <div id="art-view">
                <div id="art-head">
                    <h1 id="art-h1"></h1>
                    <div id="art-sub"></div>
                    <div id="art-date"></div>
                </div>
                <div id="art-body" class="art-body"></div>
                <div class="art-foot">
                    <div class="sub-wrap">
                        <div class="sub-row" id="sub-row">
                            <input class="sub-email-in" id="sub-email"
                                type="email"
                                placeholder="email@example.com　新着記事をメールで受け取る">
                            <button class="sub-go" id="sub-go">Subscribe</button>
                        </div>
                        <div class="sub-ok" id="sub-ok">
                            <div class="sub-ok-chip">
                                <span class="sub-ok-check">✓</span>
                                <span>Subscribed</span>
                            </div>
                            <div class="sub-ok-msg" id="sub-ok-msg"></div>
                        </div>
                    </div>
                    <div class="art-nav" id="art-nav"></div>
                    <div class="art-rel" id="art-rel"></div>
                </div>
                <div style="height:96px"></div>
            </div>

            <!-- About view -->
            <div id="about-view">
                <div id="about-cont">
                    <h1 id="about-h1">about</h1>
                    <div class="about-grid">
                        <div class="about-text">
                            <p class="about-catch">建築・空間・デザインをめぐる思索、試論 /</p>
                            <p class="about-catch-en">Explorations and Abductive Speculations on Architecture, Space, and Design.</p>
                            <p class="about-desc" id="about-desc" style="display:none"></p>
                        </div>
                        <div class="about-contact" id="about-contact"></div>
                    </div>
                </div>
                <div style="flex:1 0 96px;min-height:96px"></div>
                <div class="end-rule always"></div>
            </div>

            <div class="end-rule" id="right-end-rule"></div>
        </div>
        <div class="sb"><div class="sb-thumb" id="right-sb"></div></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';

const SUPABASE_URL = 'https://eiyzlawmcyybchxzyozr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpeXpsYXdtY3l5YmNoeHp5b3pyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMDI2MjQsImV4cCI6MjA5NTU3ODYyNH0.SZVwqWKkk31npqdiiG5m3HdkF4JnQ7SgEzThaFfZ4q4';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
    global: { fetch: (url, opts) => fetch(url, { ...opts, cache: 'no-store' }) },
});

// ── State ────────────────────────────────────────
let articles = [];
let displayedCount = 0;
let activeCat = '';
let activeId = null;
let siteAboutContent = '';
let siteSnsX = '', siteSnsFb = '', siteSnsIg = '', siteSnsSite = '';
const PAGE = 20;

// DB category → display button group
const CAT_DISPLAY = { '': 'all', essay: 'essay', log: 'days', days: 'days', books: 'books', spaces: 'spaces' };
// Button group → matching DB categories
const CAT_DB = { '': null, essay: ['essay'], days: ['log', 'days'], books: ['books'], spaces: ['spaces'] };

function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function articleMatchesCat(a, cat) {
    if (!cat) return true;
    return (CAT_DB[cat] || []).includes(a.category || '');
}

// ── Article list ─────────────────────────────────
function renderList() {
    const el = document.getElementById('article-list');
    const slice = articles.slice(0, displayedCount);
    el.innerHTML = '';
    slice.forEach(a => {
        const isOn = a.id === activeId;
        const isDim = !articleMatchesCat(a, activeCat);
        const item = document.createElement('a');
        item.href = `/article/${a.id}`;
        item.className = 'list-item' + (isOn ? ' on' : '') + (isDim ? ' dim' : '');
        item.dataset.id = a.id;
        item.innerHTML =
            `<span class="i-row1">${esc(a.title)}${a.subtitle ? `<span class="i-sub">${esc(a.subtitle)}</span>` : ''}</span>` +
            `<span class="i-date">${esc(a.date || '')}</span>`;
        item.addEventListener('click', e => { e.preventDefault(); openArticle(a.id); });
        el.appendChild(item);
    });

    const btn = document.getElementById('load-more');
    btn.style.display = displayedCount < articles.length ? '' : 'none';
}

function doLoadMore() {
    const btn = document.getElementById('load-more');
    const orig = btn.textContent;
    btn.textContent = '読み込み中…';
    btn.disabled = true;
    setTimeout(() => {
        displayedCount = Math.min(displayedCount + PAGE, articles.length);
        renderList();
        btn.disabled = false;
        btn.textContent = orig;
    }, 600);
}

// ── Open article ─────────────────────────────────
function openArticle(id, pushState = true) {
    const a = articles.find(x => x.id === id);
    if (!a) return;
    activeId = id;
    if (pushState) history.pushState({ id }, '', `/article/${id}`);

    // Update list
    document.querySelectorAll('.list-item').forEach(el => {
        el.classList.toggle('on', Number(el.dataset.id) === id);
    });

    // Fill article
    document.getElementById('art-h1').textContent = a.title || '';
    const subEl = document.getElementById('art-sub');
    subEl.textContent = a.subtitle || '';
    subEl.style.display = a.subtitle ? '' : 'none';
    document.getElementById('art-date').textContent = a.date || '';
    document.getElementById('art-body').innerHTML = a.content || '';

    // Prev / next (articles are newest-first, so prev = later index = older)
    const idx = articles.indexOf(a);
    const prev = articles[idx + 1] || null;
    const next = articles[idx - 1] || null;
    const navEl = document.getElementById('art-nav');
    navEl.innerHTML = (prev || next) ? `
        ${prev ? `<a href="/article/${prev.id}" onclick="event.preventDefault();openArticle(${prev.id})">
            <span class="nav-lbl">前の記事</span>
            <span>${esc(prev.title)}</span>
        </a>` : '<span></span>'}
        ${next ? `<a href="/article/${next.id}" class="nxt" onclick="event.preventDefault();openArticle(${next.id})">
            <span class="nav-lbl">次の記事</span>
            <span>${esc(next.title)}</span>
        </a>` : '<span></span>'}
    ` : '';

    // Related (same category, up to 3)
    const related = articles.filter(x => x.id !== id && x.category === a.category).slice(0, 3);
    const relEl = document.getElementById('art-rel');
    relEl.innerHTML = related.length ? `<div class="rel-lbl">関連する記事</div>` +
        related.map(r => `<a class="rel-item" href="/article/${r.id}" onclick="event.preventDefault();openArticle(${r.id})">
            <span>${esc(r.title)}${r.subtitle ? `<span class="i-sub">${esc(r.subtitle)}</span>` : ''}</span>
            <span class="rel-date">${esc(r.date || '')}</span>
        </a>`).join('') : '';

    resetSubForm();
    showRight('article');
    document.getElementById('right-col').scrollTop = 0;

    // Scroll list item into view
    const li = document.querySelector(`.list-item[data-id="${id}"]`);
    if (li) li.scrollIntoView({ block: 'nearest' });
}

// ── Open about ───────────────────────────────────
function openAbout(pushState = true) {
    activeId = null;
    if (pushState) history.pushState({}, '', '/about');
    document.querySelectorAll('.list-item').forEach(el => el.classList.remove('on'));

    const descEl = document.getElementById('about-desc');
    if (siteAboutContent) {
        descEl.innerHTML = esc(siteAboutContent).replace(/\n/g, '<br>');
        descEl.style.display = '';
    }

    const cEl = document.getElementById('about-contact');
    const links = [
        siteSnsX    ? `<a href="${esc(siteSnsX)}" target="_blank" rel="noopener">X (Twitter)</a>` : '',
        siteSnsFb   ? `<a href="${esc(siteSnsFb)}" target="_blank" rel="noopener">Facebook</a>` : '',
        siteSnsIg   ? `<a href="${esc(siteSnsIg)}" target="_blank" rel="noopener">Instagram</a>` : '',
        siteSnsSite ? `<a href="${esc(siteSnsSite)}" target="_blank" rel="noopener">Website</a>` : '',
    ].filter(Boolean);
    cEl.innerHTML = links.length
        ? `<div class="about-contact-lbl">Contact</div>${links.join('')}`
        : '';

    showRight('about');
    document.getElementById('right-col').scrollTop = 0;
}

// ── Show / hide right panel ───────────────────────
function showRight(mode) {
    document.getElementById('art-view').style.display   = mode === 'article' ? 'block' : 'none';
    document.getElementById('about-view').style.display = mode === 'about'   ? 'flex'  : 'none';

    const rw = document.getElementById('right-wrap');
    const lw = document.getElementById('left-wrap');
    const rh = document.getElementById('right-head');
    const w = window.innerWidth;

    if (w <= 759) {
        // Mobile: swap panels
        lw.classList.add('hidden');
        rw.classList.add('open');
        rh.innerHTML = `<a class="back-lnk" href="/" onclick="event.preventDefault();goHome()">fragments</a>`;
    } else if (w < 1200) {
        // Tablet: overlay
        rw.classList.add('open');
        rh.innerHTML = `<a class="back-lnk" href="/" onclick="event.preventDefault();goHome()">fragments</a>`;
    } else {
        // PC: right col in grid — no special show/hide needed
        rh.innerHTML = '';
    }
}

function goHome(pushState = true) {
    activeId = null;
    if (pushState) history.pushState({}, '', '/');
    document.querySelectorAll('.list-item').forEach(el => el.classList.remove('on'));

    const rw = document.getElementById('right-wrap');
    const lw = document.getElementById('left-wrap');
    rw.classList.remove('open');
    lw.classList.remove('hidden');

    document.getElementById('art-view').style.display   = 'none';
    document.getElementById('about-view').style.display = 'none';
    document.getElementById('right-col').scrollTop = 0;
}

// ── Subscribe form ────────────────────────────────
function resetSubForm() {
    document.getElementById('sub-row').style.display = 'flex';
    document.getElementById('sub-ok').style.display = 'none';
    document.getElementById('sub-email').value = '';
    document.getElementById('sub-go').textContent = 'Subscribe';
    document.getElementById('sub-go').disabled = false;
}

async function doSubscribe() {
    const input = document.getElementById('sub-email');
    const email = input.value.trim();
    if (!email.includes('@')) return;

    const btn = document.getElementById('sub-go');
    btn.textContent = 'Sending…';
    btn.disabled = true;

    const { error } = await sb.from('subscribers').insert({ email });

    document.getElementById('sub-row').style.display = 'none';
    document.getElementById('sub-ok').style.display  = 'flex';
    document.getElementById('sub-ok-msg').textContent = error
        ? (error.code === '23505' ? 'このメールアドレスはすでに登録されています' : '登録に失敗しました。もう一度お試しください。')
        : `${email} に確認メールを送りました。メール内のリンクを押すと登録が完了します。`;
}

// ── Custom scrollbar ──────────────────────────────
function setupScrollbar(colEl, thumbEl) {
    const FADE_DELAY = 700;
    let timer = null;

    function updateThumb() {
        const { scrollTop, scrollHeight, clientHeight } = colEl;
        if (scrollHeight <= clientHeight + 2) { thumbEl.style.display = 'none'; return; }
        thumbEl.style.display = '';

        const headerEl = colEl.querySelector('[id$="-head"]');
        const headerH = headerEl ? headerEl.offsetHeight : 0;
        const trackTop = headerH + 10;
        const trackBot = clientHeight - 10;
        const trackH = trackBot - trackTop;
        if (trackH <= 0) return;

        const thumbH = Math.max(20, (clientHeight / scrollHeight) * trackH);
        const thumbTop = trackTop + (scrollTop / (scrollHeight - clientHeight)) * (trackH - thumbH);
        thumbEl.style.height = thumbH + 'px';
        thumbEl.style.top    = thumbTop + 'px';
    }

    colEl.addEventListener('scroll', () => {
        thumbEl.classList.add('showing');
        updateThumb();

        clearTimeout(timer);
        timer = setTimeout(() => thumbEl.classList.remove('showing'), FADE_DELAY);

        // End-rule
        const { scrollTop, scrollHeight, clientHeight } = colEl;
        colEl.classList.toggle('at-end', scrollHeight - scrollTop - clientHeight < 2);
    }, { passive: true });

    new ResizeObserver(updateThumb).observe(colEl);
}

// ── Load data ─────────────────────────────────────
async function loadArticles() {
    const { data, error } = await sb.from('articles')
        .select('id, title, subtitle, date, category, content, pinned')
        .order('date', { ascending: false })
        .order('id',   { ascending: false });
    if (error) { console.error('articles fetch failed', error); return; }

    const raw = data || [];
    articles = [...raw.filter(a => a.pinned), ...raw.filter(a => !a.pinned)];
    displayedCount = Math.min(PAGE, articles.length);
    renderList();
}

async function loadSettings() {
    const { data } = await sb.from('site_settings')
        .select('site_title, about_content, sns_x_url, sns_facebook_url, sns_instagram_url, sns_website_url')
        .eq('id', 1).single();
    if (!data) return;
    if (data.site_title) {
        document.getElementById('site-name').textContent = data.site_title;
        document.title = data.site_title;
    }
    siteAboutContent = data.about_content || '';
    siteSnsX    = data.sns_x_url       || '';
    siteSnsFb   = data.sns_facebook_url || '';
    siteSnsIg   = data.sns_instagram_url || '';
    siteSnsSite = data.sns_website_url  || '';
}

// ── Routing ───────────────────────────────────────
function getRouteArticleId() {
    const m = location.pathname.match(/^\/article\/(\d+)/);
    return m ? parseInt(m[1], 10) : null;
}
function isAboutRoute() { return location.pathname === '/about'; }

function handleRoute() {
    const aid = getRouteArticleId();
    if (aid) {
        // Make sure we display this article even if it's beyond current displayedCount
        const idx = articles.findIndex(a => a.id === aid);
        if (idx >= 0 && idx >= displayedCount) {
            displayedCount = idx + 1;
            renderList();
        }
        openArticle(aid, false);
        return;
    }
    if (isAboutRoute()) { openAbout(false); return; }
    // top
    goHome(false);
}

// ── Boot ──────────────────────────────────────────
async function init() {
    await Promise.all([loadSettings(), loadArticles()]);

    // Category buttons
    document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            activeCat = btn.dataset.cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('on'));
            btn.classList.add('on');
            renderList();
        });
    });

    // Load more
    document.getElementById('load-more').addEventListener('click', doLoadMore);

    // About link
    document.getElementById('about-lnk').addEventListener('click', e => {
        e.preventDefault(); openAbout();
    });

    // Subscribe nav link — scroll to form if article is open
    document.getElementById('sub-nav-lnk').addEventListener('click', e => {
        e.preventDefault();
        const artView = document.getElementById('art-view');
        if (artView.style.display !== 'none') {
            document.getElementById('sub-email').scrollIntoView({ behavior: 'smooth', block: 'center' });
            document.getElementById('sub-email').focus();
        }
    });

    // Subscribe form
    document.getElementById('sub-go').addEventListener('click', doSubscribe);
    document.getElementById('sub-email').addEventListener('keydown', e => {
        if (e.key === 'Enter') doSubscribe();
    });

    // Site name click → home
    document.getElementById('site-name').addEventListener('click', e => {
        e.preventDefault(); goHome();
    });

    // Back/forward
    window.addEventListener('popstate', () => handleRoute());

    // Scrollbars (PC / tablet only — hidden on mobile via CSS)
    setupScrollbar(
        document.getElementById('left-col'),
        document.getElementById('left-sb')
    );
    setupScrollbar(
        document.getElementById('right-col'),
        document.getElementById('right-sb')
    );

    handleRoute();
}

init();
</script>
