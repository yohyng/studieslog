                container.innerHTML = '<p class="text-xs opacity-40 py-4">見つかりませんでした。</p>';
                return;
            }
            meta.textContent = `${results.length}件見つかりました`;
            container.innerHTML = results.map(a => {
                const plainContent = stripHtml(a.content);
                const excerptHtml = plainContent.toLowerCase().includes(q.toLowerCase()) ? highlightExcerpt(plainContent, q, 40) : '';
                return `
                    <a href="/article/${a.id}" class="flex flex-col gap-1 py-4 border-b opacity-90 hover:opacity-100 transition-opacity" style="border-color: color-mix(in srgb, currentColor 30%, transparent);">
                        <div class="flex items-baseline justify-between gap-4">
                            <span class="text-sm">${highlightText(a.title, q)}</span>
                            <span class="text-xs opacity-60 whitespace-nowrap">${a.date}</span>
                        </div>
                        ${excerptHtml ? `<p class="text-xs opacity-60">${excerptHtml}</p>` : ''}
                    </a>
                `;
            }).join('');
        }

        function clearSearch() {
            const input = document.getElementById('search-input');
            input.value = '';
            document.getElementById('search-clear').classList.add('hidden');
            renderSearchResults('');
            history.replaceState({}, '', '/search');
            input.focus();
        }

        function renderSearchPage() {
            hideAllViews();
            document.getElementById('search-view').classList.remove('hidden');
            const input = document.getElementById('search-input');
            const initialQuery = new URLSearchParams(location.search).get('q') || '';
            input.value = initialQuery;
            document.getElementById('search-clear').classList.toggle('hidden', initialQuery.trim() === '');
            renderSearchResults(initialQuery);

            let debounceTimer = null;
            input.oninput = () => {
                document.getElementById('search-clear').classList.toggle('hidden', input.value.trim() === '');
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    const query = input.value;
                    renderSearchResults(query);
                    const url = query.trim() ? `/search?q=${encodeURIComponent(query)}` : '/search';
                    history.replaceState({}, '', url);
                }, 200);
            };
            input.focus();
        }

        async function loadArticles() {
            const { data, error } = await sb.from('articles').select('*, article_tags(tags(id,slug,name))').order('date', { ascending: false }).order('id', { ascending: false });
            if (error) {
                console.error(error);
                showToast('記事の読み込みに失敗しました');
                return;
            }
            articles = (data || []).map(a => ({ ...a, tags: (a.article_tags || []).map(row => row.tags).filter(Boolean) }));

            if (isAboutRoute()) {
                renderAboutPage();
                return;
            }
            if (isContactRoute()) {
                renderContactPage();
                return;
            }
            const tagSlug = getTagSlug();
            if (tagSlug) {
                await renderTagPage(tagSlug);
                return;
            }
            // パターンB(ハブ型トップ)では"/"がナビゲーション+タグ一覧のハブに、"/list"が本文プレビュー付きの
            // 時系列フィード(パターンAの"/"相当)になる。パターンA(既定)は今まで通り"/"がフィード、"/list"がタイトル一覧。
            // パターンC(カード型トップ)は"/"がカードグリッドになり、"/list"はパターンA同様タイトル一覧のまま
            if (homepageLayout === 'hub' && location.pathname.replace(/\/$/, '') === '') {
                await renderHubPage();
                return;
            }
            if (homepageLayout === 'card' && location.pathname.replace(/\/$/, '') === '') {
                renderCardPage();
                return;
            }
            if (isListRoute() && homepageLayout !== 'hub') {
                await renderTitleList();
                return;
            }
            if (isTagListRoute()) {
                await renderTagList();
                return;
            }
            if (isSearchRoute()) {
                renderSearchPage();
                return;
            }

            displayedCount = 0;
            listContainer.innerHTML = '';

            // 記事専用URL(/article/数字)や旧形式の共有リンク(#article-数字)からアクセスした場合、その記事まで表示して開く
            const targetId = getPathArticleId() ?? getHashArticleId();
            const targetIndex = targetId != null ? articles.findIndex(a => a.id === targetId) : -1;
            if (targetIndex !== -1) {
                renderArticles(targetIndex + 1);
                const targetArticle = document.getElementById(`article-${targetId}`);
                if (targetArticle) {
                    openArticle(targetArticle.querySelector('.cursor-pointer.group'));
                    targetArticle.scrollIntoView({ behavior: 'instant', block: 'start' });
                }
                return;
            }
            renderArticles(3);
        }

        function toggleArticle(wrapperNode, evt) {
            const snippet = wrapperNode.querySelector('.article-snippet');
            const isOpen = snippet.classList.contains('open-full');
            // 開いている間は、本文エリアのクリックでは閉じない(読んだり選択したりの邪魔をしない)。閉じるのはタイトル部分か「↑閉じる」ボタンのみ
            if (isOpen && evt && evt.target.closest('.content-body')) return;
            const articleEl = wrapperNode.closest('article');
            const id = articleEl.dataset.id;
            if (isOpen) {
                closeArticle(wrapperNode);
                history.pushState({}, '', '/');
            } else {
                openArticle(wrapperNode);
                history.pushState({}, '', `/article/${id}`);
            }
        }

        // ブラウザの戻る/進むが押されたら、URLに応じた状態を素直に再構築する
        window.addEventListener('popstate', () => location.reload());

        function openArticle(wrapperNode) {
            const snippet = wrapperNode.querySelector('.article-snippet');
            snippet.classList.add('open-full');
            snippet.style.maxHeight = 'none';
            wrapperNode.querySelector('.open-btn').classList.add('hidden');
            wrapperNode.nextElementSibling.classList.remove('hidden');
        }

        function closeArticle(wrapperNode) {
            const snippet = wrapperNode.querySelector('.article-snippet');
            snippet.classList.remove('open-full');
            wrapperNode.querySelector('.open-btn').classList.remove('hidden');
            const articleEl = wrapperNode.closest('article');
            const article = articles.find(a => a.id === Number(articleEl.dataset.id));
            if (article) snippet.style.maxHeight = collapsedSnippetHeightPx(article) + 'px';
            wrapperNode.nextElementSibling.classList.add('hidden');
        }

        function showToast(msg) {
            const t = document.getElementById('toast'); t.textContent = msg; t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2000);
        }

        // ニュースレター購読(週次ダイジェストの送信対象に登録する)
        let subscribeModalOpenedAt = 0;

        function openSubscribeModal() {
            document.getElementById('subscribe-modal').classList.remove('hidden');
            document.getElementById('subscribe-message').classList.add('hidden');
            document.getElementById('subscribe-email').focus();
            subscribeModalOpenedAt = Date.now();
        }

        function closeSubscribeModal() {
            document.getElementById('subscribe-modal').classList.add('hidden');
        }

        async function submitSubscribe(event) {
            event.preventDefault();
            const input = document.getElementById('subscribe-email');
            const msg = document.getElementById('subscribe-message');
            const email = input.value.trim();
            if (!email) return false;

            // 簡易bot対策: 本来空のはずのハニーポット欄が埋まっている、
            // またはモーダルを開いてから極端に早く送信されている場合はbotとみなし、
            // 実際には登録せず成功したふりだけ見せる(botに検知されたと悟らせない)
            const honeypot = document.getElementById('subscribe-hp').value;
            const tooFast = Date.now() - subscribeModalOpenedAt < 1500;
            if (honeypot || tooFast) {
                msg.classList.remove('hidden');
                msg.textContent = '登録しました。ありがとうございます。';
                input.value = '';
                return false;
            }

            const { error } = await sb.from('subscribers').insert({ email });
            msg.classList.remove('hidden');
            if (error) {
                msg.textContent = error.code === '23505' ? 'このメールアドレスはすでに登録されています' : '登録に失敗しました';
            } else {
                msg.textContent = '登録しました。ありがとうございます。';
                input.value = '';
            }
            return false;
        }

        // お問い合わせフォーム。送信内容はメール等では送らず、管理画面から確認できるようDBに保存するだけ
        async function submitInquiry(event) {
            event.preventDefault();
            const emailInput = document.getElementById('inquiry-email');
            const messageInput = document.getElementById('inquiry-message');
            const status = document.getElementById('inquiry-status');
            const email = emailInput.value.trim();
            const message = messageInput.value.trim();
            if (!email || !message) return false;

            // 購読フォームと同じ簡易bot対策(ハニーポット+送信速度チェック)
            const honeypot = document.getElementById('inquiry-hp').value;
            const tooFast = Date.now() - contactPageRenderedAt < 1500;
            if (honeypot || tooFast) {
                status.classList.remove('hidden');
                status.textContent = '送信しました。ありがとうございます。';
                emailInput.value = '';
                messageInput.value = '';
                return false;
            }

            const { error } = await sb.from('inquiries').insert({ email, message });
            status.classList.remove('hidden');
            if (error) {
                status.textContent = '送信に失敗しました';
            } else {
                status.textContent = '送信しました。ありがとうございます。';
                emailInput.value = '';
                messageInput.value = '';
            }
            return false;
        }

        function isHomeRoute() {
            // パターンBでは本文プレビュー付きフィードは"/"ではなく"/list"に出るため、判定を入れ替える
            if (homepageLayout === 'hub') return isListRoute();
            // パターンCの"/"はカードグリッドで#article-listを使わないため、無限スクロール判定からは除外する
            if (homepageLayout === 'card' && location.pathname.replace(/\/$/, '') === '') return false;
            return !isListRoute() && !isTagListRoute() && !isAboutRoute() && !isContactRoute() && !isSearchRoute() && !getTagSlug();
        }

        window.addEventListener('scroll', () => { if(isHomeRoute() && window.innerHeight + window.scrollY >= document.body.offsetHeight - 100) renderArticles(1); });

        // 実験的機能: スクロール進行度バー
        function updateScrollProgress() {
            const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
            const scrollHeight = (document.documentElement.scrollHeight || document.body.scrollHeight) - document.documentElement.clientHeight;
            const pct = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
            document.getElementById('scroll-progress').style.width = pct + '%';
        }
        window.addEventListener('scroll', updateScrollProgress, { passive: true });
        window.addEventListener('resize', updateScrollProgress);

        // パターンCだけ: サイトタイトルの表示(文字・フォント・色)をそのまま複製して、
        // スクロール中に出てくる固定ヘッダーに反映する
        function updateCardStickyTitle() {
            const src = document.getElementById('site-title');
            const dst = document.getElementById('card-sticky-title-text');
            if (!src || !dst) return;
            dst.textContent = src.textContent;
            dst.style.fontFamily = src.style.fontFamily;
            dst.style.fontSize = src.style.fontSize;
            dst.style.color = src.style.color;
        }

        // パターンCのカードグリッドを見ている間だけ、本来のヘッダーを過ぎてスクロールしたら
        // タイトルだけの固定ヘッダーを出す
        function handleCardStickyScroll() {
            const stickyHeader = document.getElementById('card-sticky-header');
            const cardView = document.getElementById('card-view');
            const isCardHome = homepageLayout === 'card' && !cardView.classList.contains('hidden');
            if (!isCardHome) {
                stickyHeader.classList.add('hidden');
                return;
            }
            const headerEl = document.querySelector('header');
            const threshold = headerEl ? headerEl.getBoundingClientRect().bottom + window.scrollY : 200;
            stickyHeader.classList.toggle('hidden', window.scrollY <= threshold);
        }
        window.addEventListener('scroll', handleCardStickyScroll, { passive: true });

        // 実験的機能: キーボードショートカット(/で検索、j/kで記事送り)
        function navigateArticles(direction) {
            const els = Array.from(document.querySelectorAll('#article-list > article, #tag-article-list > article'));
            if (els.length === 0) return;
            const scrollPos = window.scrollY + 100;
            let currentIndex = 0;
            els.forEach((el, i) => { if (el.offsetTop <= scrollPos) currentIndex = i; });
            const nextIndex = Math.min(Math.max(currentIndex + direction, 0), els.length - 1);
            els[nextIndex].scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        document.addEventListener('keydown', (e) => {
            const tag = e.target.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA' || e.target.isContentEditable) return;
            if (e.key === '/') {
                e.preventDefault();
                if (isSearchRoute()) {
                    document.getElementById('search-input')?.focus();
                } else {
                    location.href = '/search';
                }
            } else if (e.key === 'j') {
                navigateArticles(1);
            } else if (e.key === 'k') {
                navigateArticles(-1);
            }
        });

        // テスト実装: タイトル横の台形装飾。サイズ・位置・不透明度・線の太さ・ランダム度・揺れ幅・ホバー反応の強さは
        // すべて表示設定(site_settings)のtitle_shape_*列で管理者が調整できる
        let titleShapeSettings = {
            enabled: true, width: 200, height: 193, top: -45,
            opacity: 0.4, strokeWidth: 1, jitter: 14, wobble: 6, hoverIntensity: 1,
        };
        let titleShapeBase = null;

        function applyTitleShapeSettings(data) {
            titleShapeSettings = {
                enabled: data.title_shape_enabled !== false,
                width: data.title_shape_width || 200,
                height: data.title_shape_height || 193,
                top: data.title_shape_top != null ? data.title_shape_top : -45,
                opacity: data.title_shape_opacity != null ? data.title_shape_opacity : 0.4,
                strokeWidth: data.title_shape_stroke_width != null ? data.title_shape_stroke_width : 1,
                jitter: data.title_shape_jitter != null ? data.title_shape_jitter : 14,
                wobble: data.title_shape_wobble != null ? data.title_shape_wobble : 6,
                hoverIntensity: data.title_shape_hover_intensity != null ? data.title_shape_hover_intensity : 1,
            };
            const wrap = document.getElementById('title-rect-wrap');
            const polygon = document.querySelector('#title-rect polygon');
            if (wrap) {
                wrap.style.display = titleShapeSettings.enabled ? '' : 'none';
                wrap.style.width = titleShapeSettings.width + 'px';
                wrap.style.height = titleShapeSettings.height + 'px';
                // +32はheaderのpt-8とバランスを合わせるための固定オフセット(絶対配置の基準はheaderのpaddingでは動かないため手動で足している)
                wrap.style.top = (titleShapeSettings.top + 32) + 'px';
            }
            if (polygon) {
                polygon.style.opacity = titleShapeSettings.opacity;
                polygon.style.strokeWidth = titleShapeSettings.strokeWidth;
            }
            randomizeTitleShape();
        }

        // 台形の基準形。ページ読み込みのたびにこの中から1つをランダムに選び、さらに少しジッターをかける
        const TITLE_SHAPE_VARIANTS = [
            [[30, 30], [180, 6], [124, 130], [30, 97]],
            [[130, 20], [180, 38], [123, 185], [30, 94]],
            [[71, 20], [30, 36], [42, 185], [180, 107]],
        ];

        function randomizeTitleShape() {
            const jitterAmount = titleShapeSettings.jitter;
            const basePoints = TITLE_SHAPE_VARIANTS[Math.floor(Math.random() * TITLE_SHAPE_VARIANTS.length)];
            titleShapeBase = basePoints.map(([x, y]) => [
                x + (Math.random() * 2 - 1) * jitterAmount,
                y + (Math.random() * 2 - 1) * jitterAmount,
            ]);
        }
        randomizeTitleShape();

        // 何もしていない間も頂点ごとに違う周期のsin/cosでゆっくり辺の長さが揺れ続ける
        function animateTitleShape(timestamp) {
            const polygon = document.querySelector('#title-rect polygon');
            if (polygon && titleShapeBase) {
                const t = timestamp / 1000;
                const amp = titleShapeSettings.wobble;
                const points = titleShapeBase
                    .map(([x, y], i) => {
                        const ox = Math.sin(t * (0.3 + i * 0.07) + i * 1.7) * amp;
                        const oy = Math.cos(t * (0.25 + i * 0.05) + i * 2.3) * amp;
                        return `${(x + ox).toFixed(1)},${(y + oy).toFixed(1)}`;
                    })
                    .join(' ');
                polygon.setAttribute('points', points);
            }
            requestAnimationFrame(animateTitleShape);
        }
        requestAnimationFrame(animateTitleShape);

        // テスト実装: タイトル横の矩形の線に、カーソルの動きに合わせたゆらぎ(3D傾き)を付ける
        function setupTitleRectSway() {
            const wrap = document.getElementById('title-rect-wrap');
            const rect = document.getElementById('title-rect');
            if (!wrap || !rect) return;
            wrap.addEventListener('mousemove', (e) => {
                const bounds = wrap.getBoundingClientRect();
                const relX = (e.clientX - bounds.left) / bounds.width - 0.5;
                const relY = (e.clientY - bounds.top) / bounds.height - 0.5;
                const k = titleShapeSettings.hoverIntensity;
                rect.style.transform = `rotateX(${(-relY * 10 * k).toFixed(2)}deg) rotateY(${(relX * 16 * k).toFixed(2)}deg)`;
            });
            wrap.addEventListener('mouseleave', () => {
                rect.style.transform = 'rotateX(0deg) rotateY(0deg)';
            });
        }
        setupTitleRectSway();

        (async () => {
            await applySiteSettings();
            initDebugLayoutButton();
            await loadArticles();
        })();
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
