<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>静謐な執筆アーカイブ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Noto+Serif+JP:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Old+Mincho:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&family=M+PLUS+Rounded+1c:wght@400;500;700&family=Kaisei+Tokumin:wght@400;500;700&family=Klee+One:wght@400;600&family=Kosugi+Maru&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Shippori Mincho', serif;
            background-color: #6b7278; /* 石板色 */
            color: rgba(255, 255, 255, 0.9);
            line-height: 2.2;
            letter-spacing: 0.08em;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        .fade-in { animation: fadeIn 1.5s ease-out forwards; opacity: 0; transform: translateY(10px); }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        .article-title { color: rgba(255, 255, 255, 1); transition: opacity 0.8s ease; }
        .group:hover .article-title { opacity: 1; }

        .article-snippet {
            position: relative;
            overflow: hidden;
            max-height: 4.8rem;
            transition: max-height 0.55s ease-out, opacity 0.55s ease-out;
            mask-image: linear-gradient(to bottom, black 20%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 20%, transparent 100%);
            opacity: 0.5;
        }

        .open-full { max-height: 2000px; mask-image: none; -webkit-mask-image: none; opacity: 0.9; cursor: text; }
        
        .content-body img { max-width: 100%; height: auto; border-radius: 4px; margin: 2em 0; filter: grayscale(100%) opacity(0.6); transition: filter 1.5s ease; }
        .open-full .content-body img { filter: grayscale(0%) opacity(1); }
        .content-body blockquote { border-left: 1px solid rgba(255,255,255,0.3); padding-left: 1.5em; margin: 2em 0; font-style: italic; opacity: 0.7; }
        .content-body h2 { font-size: 1.2em; margin: 2em 0 1em 0; opacity: 0.9; }
        [contenteditable="true"] { outline: none; border-bottom: 1px dashed rgba(255,255,255,0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-24 px-6 md:px-0">

    <!-- 左上の表示設定ボタン -->
    <button onclick="toggleDisplaySettings()" class="fixed top-6 left-6 z-40 text-white opacity-40 hover:opacity-100 transition-opacity duration-300 px-3 py-2 text-xs rounded hover:bg-white/10" title="表示設定">⚙ 表示設定</button>

    <!-- 表示設定モーダル -->
    <div id="display-settings-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-[#3a3f44]/95 backdrop-blur-md border border-white/20 rounded-lg p-8 max-w-md w-full max-h-96 overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-sm font-medium text-white">表示設定</h2>
                <button onclick="toggleDisplaySettings()" class="text-white/50 hover:text-white text-lg">×</button>
            </div>
            
            <!-- フォント -->
            <div class="mb-6">
                <label class="text-xs text-white/70 block mb-2">本文フォント</label>
                <select id="font-select" class="w-full bg-white/10 text-white text-xs rounded px-3 py-2 border border-white/20 focus:outline-none" onchange="applyFont(this.value); saveDisplaySettings()">
                    <optgroup label="明朝体">
                        <option value="'Shippori Mincho', serif">秀英明朝 (Shippori Mincho)</option>
                        <option value="'Noto Serif JP', serif">Noto Serif JP</option>
                        <option value="'Zen Old Mincho', serif">Zen Old Mincho</option>
                        <option value="'Kaisei Tokumin', serif">Kaisei Tokumin</option>
                    </optgroup>
                    <optgroup label="ゴシック体">
                        <option value="'Noto Sans JP', sans-serif">Noto Sans JP</option>
                        <option value="'Zen Kaku Gothic New', sans-serif">Zen Kaku Gothic New</option>
                        <option value="'Kosugi Maru', sans-serif">Kosugi Maru</option>
                    </optgroup>
                    <optgroup label="丸ゴシック体">
                        <option value="'Zen Maru Gothic', sans-serif">Zen Maru Gothic</option>
                        <option value="'M PLUS Rounded 1c', sans-serif">M PLUS Rounded 1c</option>
                    </optgroup>
                    <optgroup label="手書き風">
                        <option value="'Klee One', cursive">Klee One</option>
                    </optgroup>
                </select>
            </div>

            <!-- 背景色 -->
            <div class="mb-6">
                <label class="text-xs text-white/70 block mb-2">背景色</label>
                <div class="flex gap-2 mb-3">
                    <input type="color" id="bg-color-picker" class="w-12 h-12 rounded cursor-pointer" onchange="applyBackgroundColor(this.value); saveDisplaySettings()">
                    <div class="flex-1 flex flex-col justify-center">
                        <span id="bg-color-value" class="text-xs text-white/60 font-mono"></span>
                    </div>
                </div>
                <!-- 背景色プリセット -->
                <div class="text-xs text-white/50 mb-2">プリセット:</div>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="applyBackgroundColor('#6b7278'); saveDisplaySettings();" class="h-8 rounded border border-white/20 hover:border-white/50 transition-colors" style="background-color: #6b7278;" title="石板色"></button>
                    <button onclick="applyBackgroundColor('#2c3e50'); saveDisplaySettings();" class="h-8 rounded border border-white/20 hover:border-white/50 transition-colors" style="background-color: #2c3e50;" title="深紺"></button>
                    <button onclick="applyBackgroundColor('#34495e'); saveDisplaySettings();" class="h-8 rounded border border-white/20 hover:border-white/50 transition-colors" style="background-color: #34495e;" title="深灰"></button>
                    <button onclick="applyBackgroundColor('#1a1f24'); saveDisplaySettings();" class="h-8 rounded border border-white/20 hover:border-white/50 transition-colors" style="background-color: #1a1f24;" title="漆黒"></button>
                    <button onclick="applyBackgroundColor('#4a5568'); saveDisplaySettings();" class="h-8 rounded border border-white/20 hover:border-white/50 transition-colors" style="background-color: #4a5568;" title="暗灰"></button>
                    <button onclick="applyBackgroundColor('#1e3a5f'); saveDisplaySettings();" class="h-8 rounded border border-white/20 hover:border-white/50 transition-colors" style="background-color: #1e3a5f;" title="紺青"></button>
                    <button onclick="applyBackgroundColor('#3d5a5d'); saveDisplaySettings();" class="h-8 rounded border border-white/20 hover:border-white/50 transition-colors" style="background-color: #3d5a5d;" title="緑青"></button>
                    <button onclick="applyBackgroundColor('#5a4a3a'); saveDisplaySettings();" class="h-8 rounded border border-white/20 hover:border-white/50 transition-colors" style="background-color: #5a4a3a;" title="茶色"></button>
                </div>
            </div>
            
            <!-- 文字色 -->
            <div class="mb-6">
                <label class="text-xs text-white/70 block mb-2">文字色</label>
                <div class="flex gap-2">
                    <input type="color" id="text-color-picker" class="w-12 h-12 rounded cursor-pointer" onchange="applyTextColor(this.value); saveDisplaySettings()">
                    <div class="flex-1 flex flex-col justify-center">
                        <span id="text-color-value" class="text-xs text-white/60 font-mono"></span>
                    </div>
                </div>
                <!-- 文字色プリセット -->
                <div class="text-xs text-white/50 mb-2 mt-3">プリセット:</div>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="applyTextColor('#ffffff'); saveDisplaySettings();" class="h-8 rounded border border-white/20 hover:border-white/50 transition-colors" style="background-color: #ffffff;" title="白"></button>
                    <button onclick="applyTextColor('#e8e4d8'); saveDisplaySettings();" class="h-8 rounded border border-white/20 hover:border-white/50 transition-colors" style="background-color: #e8e4d8;" title="生成り"></button>
                    <button onclick="applyTextColor('#d4c9a8'); saveDisplaySettings();" class="h-8 rounded border border-white/20 hover:border-white/50 transition-colors" style="background-color: #d4c9a8;" title="砂色"></button>
                    <button onclick="applyTextColor('#f0d9b5'); saveDisplaySettings();" class="h-8 rounded border border-white/20 hover:border-white/50 transition-colors" style="background-color: #f0d9b5;" title="淡黄"></button>
                    <button onclick="applyTextColor('#c9d6df'); saveDisplaySettings();" class="h-8 rounded border border-white/20 hover:border-white/50 transition-colors" style="background-color: #c9d6df;" title="薄氷"></button>
                    <button onclick="applyTextColor('#a8b5a0'); saveDisplaySettings();" class="h-8 rounded border border-white/20 hover:border-white/50 transition-colors" style="background-color: #a8b5a0;" title="若竹"></button>
                    <button onclick="applyTextColor('#111111'); saveDisplaySettings();" class="h-8 rounded border border-white/20 hover:border-white/50 transition-colors" style="background-color: #111111;" title="漆黒"></button>
                    <button onclick="applyTextColor('#3a2f28'); saveDisplaySettings();" class="h-8 rounded border border-white/20 hover:border-white/50 transition-colors" style="background-color: #3a2f28;" title="焦茶"></button>
                </div>
            </div>
            
            <!-- ボタン -->
            <div class="flex gap-3 pt-4 border-t border-white/10">
                <button onclick="resetDisplaySettings()" class="flex-1 px-3 py-2 text-xs bg-white/10 hover:bg-white/20 text-white rounded transition-colors">標準に戻す</button>
                <button onclick="toggleDisplaySettings()" class="flex-1 px-3 py-2 text-xs bg-white/20 hover:bg-white/30 text-white rounded transition-colors">閉じる</button>
            </div>
        </div>
    </div>

    <div id="editor-toolbar" class="fixed top-0 left-0 w-full bg-[#3a3f44]/90 backdrop-blur-md border-b border-white/10 z-40 transform -translate-y-full transition-transform duration-500 ease-out flex flex-col">
        <div class="max-w-4xl w-full mx-auto px-6 h-16 flex justify-between items-center text-xs">
            <div class="flex items-center gap-6 opacity-60">
                <span class="opacity-50">執筆・編集モード</span>
                <button onclick="createNewArticle()" class="hover:text-white transition-colors">＋ 新たな断片</button>
            </div>
            <div class="flex items-center gap-4 opacity-70 border-x border-white/10 px-4">
                <button onclick="formatText('bold')" class="hover:text-white transition-colors px-2">太字</button>
                <button onclick="formatText('italic')" class="hover:text-white transition-colors px-2">斜体</button>
                <button onclick="formatText('formatBlock', 'H2')" class="hover:text-white transition-colors px-2">見出</button>
                <button onclick="formatText('formatBlock', 'BLOCKQUOTE')" class="hover:text-white transition-colors px-2">引用</button>
                <button onclick="insertImage()" class="hover:text-white transition-colors px-2">写真</button>
            </div>
            <div class="flex items-center gap-6 opacity-60">
                <button onclick="toggleSettingsPanel()" class="hover:text-white transition-colors">空間調整 ⚙</button>
                <button onclick="toggleEditMode(false)" class="hover:text-white transition-colors">終了 ×</button>
            </div>
        </div>
        <div id="settings-panel" class="hidden max-w-4xl w-full mx-auto px-6 py-6 border-t border-white/10 text-xs text-white/70">
            <div class="flex gap-12">
                <div class="flex flex-col gap-2 w-48">
                    <label>背景の深度</label>
                    <input type="range" min="30" max="90" value="65" class="w-full" oninput="document.body.style.backgroundColor = `hsl(210, 6%, ${this.value}%)`">
                </div>
            </div>
        </div>
    </div>

    <!-- 編集モードトリガー -->
    <div class="fixed top-6 right-6 z-30 text-xs text-white opacity-0 hover:opacity-30 transition-opacity duration-1000 cursor-default p-4" onclick="toggleEditMode(true)" title="Archive of Silence">◎</div>

    <div id="toast" class="fixed top-24 left-1/2 transform -translate-x-1/2 bg-white/10 backdrop-blur-md px-6 py-2 rounded-full text-xs opacity-0 transition-opacity duration-500 pointer-events-none z-50">保存されました</div>

    <header class="w-full max-w-2xl mb-24 opacity-0 fade-in" style="animation-delay: 0.2s;">
        <h1 class="text-sm font-medium tracking-widest opacity-80 cursor-pointer inline-block" onclick="window.scrollTo({top:0, behavior:'smooth'})">断片</h1>
        <p class="text-xs opacity-40 mt-4">記憶の集積。言葉は静かに積もっていく。</p>
    </header>

    <main id="article-list" class="w-full max-w-2xl flex flex-col gap-16 relative"></main>

    <div id="loading-indicator" class="w-full max-w-2xl mt-16 text-center text-xs opacity-0 transition-opacity duration-1000">
        <span class="opacity-30">深層を探索中...</span>
    </div>

    <script>
        // デフォルト値
        const DEFAULT_BG_COLOR = '#6b7278';
        const DEFAULT_TEXT_COLOR = '#ffffff';
        const DEFAULT_FONT = "'Shippori Mincho', serif";
        
        let articles = [
            { id: 3, date: "2023.11.14", title: "朝の境界", content: `<p>目が覚めると、部屋はまだ青かった。</p><img src="https://placehold.co/600x300/333/666?text=Morning+Fog" alt="Morning Fog"><p>コーヒーを淹れる音だけが、静寂の中で輪郭を持っている。</p>` },
            { id: 2, date: "2023.11.02", title: "沈黙の質量", content: `<p>言葉を発しない時間は、決して「無」ではない。</p><blockquote>沈黙は、最も雄弁な対話である。</blockquote>` },
            { id: 1, date: "2023.10.28", title: "忘却の速度", content: `<p>記憶は、私たちが思っているよりもずっと早く形を変えていく。</p>` }
        ];

        const listContainer = document.getElementById('article-list');
        let displayedCount = 0;
        let isEditMode = false;
        
        // 表示設定関連関数
        function toggleDisplaySettings() {
            document.getElementById('display-settings-modal').classList.toggle('hidden');
            if (!document.getElementById('display-settings-modal').classList.contains('hidden')) {
                loadDisplaySettings();
            }
        }
        
        function loadDisplaySettings() {
            const settings = JSON.parse(localStorage.getItem('displaySettings') || '{}');
            const bgColor = settings.bgColor || DEFAULT_BG_COLOR;
            const textColor = settings.textColor || DEFAULT_TEXT_COLOR;
            const font = settings.font || DEFAULT_FONT;

            document.getElementById('bg-color-picker').value = bgColor;
            document.getElementById('text-color-picker').value = textColor;
            document.getElementById('bg-color-value').textContent = bgColor;
            document.getElementById('text-color-value').textContent = textColor;
            document.getElementById('font-select').value = font;
        }

        function applyBackgroundColor(color) {
            document.body.style.backgroundColor = color;
            document.getElementById('bg-color-picker').value = color;
            document.getElementById('bg-color-value').textContent = color;
        }

        function applyTextColor(color) {
            document.body.style.color = color;
            document.getElementById('text-color-picker').value = color;
            document.getElementById('text-color-value').textContent = color;
        }

        function applyFont(font) {
            document.body.style.fontFamily = font;
            document.getElementById('font-select').value = font;
        }

        function saveDisplaySettings() {
            const settings = {
                bgColor: document.getElementById('bg-color-picker').value,
                textColor: document.getElementById('text-color-picker').value,
                font: document.getElementById('font-select').value
            };
            localStorage.setItem('displaySettings', JSON.stringify(settings));
        }

        function resetDisplaySettings() {
            applyBackgroundColor(DEFAULT_BG_COLOR);
            applyTextColor(DEFAULT_TEXT_COLOR);
            applyFont(DEFAULT_FONT);
            saveDisplaySettings();
        }

        function restoreDisplaySettings() {
            const settings = JSON.parse(localStorage.getItem('displaySettings') || '{}');
            if (settings.bgColor) {
                applyBackgroundColor(settings.bgColor);
            }
            if (settings.textColor) {
                applyTextColor(settings.textColor);
            }
            if (settings.font) {
                applyFont(settings.font);
            }
        }

        function renderArticles(count) {
            const items = articles.slice(displayedCount, displayedCount + count);
            items.forEach(article => {
                const html = `
                    <article class="fade-in relative" id="article-${article.id}" data-id="${article.id}">
                        <div class="cursor-pointer group" onclick="if(!isEditMode) openArticle(this)">
                            <div class="text-xs opacity-40 mb-2 date-field">${article.date}</div>
                            <h2 class="text-lg font-normal mb-4 article-title title-field">${article.title}</h2>
                            <div class="article-snippet text-sm opacity-70 content-body content-field">${article.content}</div>
                        </div>
                        <div class="mt-8 text-center hidden close-btn">
                            <span class="text-xs opacity-30 hover:opacity-100 cursor-pointer transition-opacity" onclick="closeArticle(this.parentElement.previousElementSibling)">↑ 閉じる</span>
                        </div>
                    </article>`;
                listContainer.insertAdjacentHTML('beforeend', html);
            });
            displayedCount += items.length;
            if (isEditMode) applyEditModeToElements();
        }

        function openArticle(wrapperNode) {
            const snippet = wrapperNode.querySelector('.article-snippet');
            snippet.classList.add('open-full');
            wrapperNode.nextElementSibling.classList.remove('hidden');
        }

        function closeArticle(wrapperNode) {
            const snippet = wrapperNode.querySelector('.article-snippet');
            snippet.classList.remove('open-full');
            wrapperNode.nextElementSibling.classList.add('hidden');
            if(isEditMode) showToast('保存されました');
        }

        function toggleEditMode(turnOn) {
            isEditMode = turnOn;
            document.getElementById('editor-toolbar').classList.toggle('-translate-y-full', !isEditMode);
            isEditMode ? applyEditModeToElements() : removeEditModeFromElements();
        }

        function applyEditModeToElements() {
            document.querySelectorAll('.title-field, .content-field, .date-field').forEach(el => el.setAttribute('contenteditable', 'true'));
        }

        function removeEditModeFromElements() {
            document.querySelectorAll('[contenteditable="true"]').forEach(el => el.removeAttribute('contenteditable'));
        }

        function formatText(cmd, val = null) { document.execCommand(cmd, false, val); }
        function insertImage() { formatText('insertImage', prompt('URL', 'https://placehold.co/600x300/333/666')); }
        function showToast(msg) { 
            const t = document.getElementById('toast'); t.textContent = msg; t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2000);
        }
        function toggleSettingsPanel() { document.getElementById('settings-panel').classList.toggle('hidden'); }
        function createNewArticle() { renderArticles(1); }

        renderArticles(3);
        window.addEventListener('scroll', () => { if(window.innerHeight + window.scrollY >= document.body.offsetHeight - 100) renderArticles(1); });
        
        // ページ読み込み時に表示設定を復元
        restoreDisplaySettings();
    </script>
</body>
</html>
