            --tag-bg-color: #ffffff;
            --tag-text-color: #6b7278;
            --tag-font-size: 12px;
            --tag-font: 'Shippori Mincho', serif;
            --tag-description-color: #ffffff;
            --tag-description-size: 12px;
            --footnote-color: #7dd3fc;
            --menu-font-size: 12px;
            --list-heading-bg-color: #ffffff;
            --list-heading-text-color: #6b7278;
            --selection-bg-color: #ffffff;
            --selection-text-color: #6b7278;
            --content-width: 42rem;
            --base-line-height: 2.2;
            --base-font-size: 16px;
            --base-letter-spacing: 0.08em;
            /* スマホは画面幅が狭く1行の文字数が少ないため、同じ行間・文字サイズの数値でも間延びして見える。狭い画面では少し詰める */
            --line-height-scale: 1;
            --font-size-scale: 1;
            /* スマホでは文字自体を縮小する一方、字間は据え置きだと相対的に間延びして1行の文字数がさらに減るため、字間も詰める */
            --letter-spacing-scale: 1;
            /* bodyの左右余白(px-5 / min-[450px]:px-8 / md:px-12 / lg:px-0)と同じ値。ハンバーガーメニューの右端をコンテンツの右端に揃えるための計算に使う */
            --body-pad: 1.25rem;
        }

        @media (max-width: 640px) {
            :root { --line-height-scale: 0.75; --font-size-scale: 0.85; --letter-spacing-scale: 0.5; }
        }

        @media (min-width: 450px) {
            :root { --body-pad: 2rem; }
        }
        @media (min-width: 768px) {
            :root { --body-pad: 3rem; }
        }
        @media (min-width: 1024px) {
            :root { --body-pad: 0px; }
        }

        /* タブレット幅も、スマホほどではないが行間が間延びして見えるので少し詰める */
        @media (min-width: 641px) and (max-width: 1023px) {
            :root { --line-height-scale: 0.9; }
        }

        /* 逆に画面が広くなるほど1行の文字数が増えて行間が相対的に間延びしやすいので、少しずつ詰める */
        @media (min-width: 1280px) {
            :root { --line-height-scale: 0.95; }
        }
        @media (min-width: 1600px) {
            :root { --line-height-scale: 0.9; }
        }

        .content-width { max-width: var(--content-width); }


        /* パターンC(カード型)のグリッドは auto-fill で列数が自然に変わるので、メディアクエリなしで
           そのままレスポンシブになる。デスクトップだけ#card-view自体の横幅を広げて、並ぶ列数を増やす */
        @media (min-width: 1024px) {
            body.card-home #card-view {
                max-width: min(1200px, 92vw);
            }
        }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.75rem; }
        .article-card {
            display: block;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            padding: 0.75rem;
            border: 1px solid color-mix(in srgb, white 15%, transparent);
            transition: opacity 0.3s ease;
        }
        .card-excerpt {
            font-size: 0.8rem;
            line-height: 1.6;
            text-align: justify;
            text-align-last: justify;
            text-justify: inter-character;
        }
        /* 枠線を引かず、文字組みだけで見えない枠を感じさせる。タイトルは両端揃えだが最後の行だけ右揃えにする
           (本文の方は最後の行まで均等に伸ばす。card-excerptの均等揃えと使い分ける) */
        .card-title { text-align: justify; text-align-last: left; text-justify: inter-character; }
        /* 画像ありのカードは、画像をカード枠いっぱいに敷き詰め、全体に黒の半透明を重ねて、
           その上にタイトル・本文を(文字カードと同じ並びで)乗せて読みやすくする */
        .article-card-image { padding: 0; position: relative; }
        .article-card-image .card-thumb-full {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(1);
            transition: filter 0.3s ease;
            z-index: 0;
        }
        @media (hover: hover) {
            .article-card-image:hover .card-thumb-full { filter: grayscale(0); }
        }
        .article-card-image::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }
        .article-card-image .card-title {
            position: relative;
            z-index: 2;
            padding: 0.75rem 0.75rem 0 0.75rem;
            color: #fff;
        }
        .article-card-image .card-excerpt {
            position: relative;
            z-index: 2;
            padding: 0 0.75rem 0.75rem 0.75rem;
            color: #fff;
        }

        /* パターンCだけ、Filterボタンとハンバーガーメニューを固定フッターの左右に寄せる。
           bodyのcard-homeクラスはrenderCardPage()が付け、hideAllViews()が外す(既存の仕組みを流用) */
        #card-fixed-footer-bar { display: none; }
        body.card-home #card-fixed-footer-bar { display: block; }
        body.card-home #hamburger-btn { top: auto; bottom: 0.875rem; right: 1.5rem; }
        body.card-home #card-filter-toggle {
            position: fixed;
            left: 1.5rem;
            bottom: 0.875rem;
            z-index: 40;
            margin-bottom: 0;
        }
        body.card-home #card-filter-panel {
            position: fixed;
            left: 1.5rem;
            bottom: 4.5rem;
            z-index: 40;
            max-width: min(90vw, 380px);
            max-height: 60vh;
            overflow-y: auto;
            padding: 1rem;
            background: color-mix(in srgb, var(--bg-color) 88%, transparent);
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            border: 1px solid color-mix(in srgb, white 15%, transparent);
            margin-bottom: 0;
        }
        /* 固定フッターに隠れないよう、カード一覧の下に余白を足す */
        body.card-home #card-view { padding-bottom: 5rem; }

        /* コンテンツ本体(.content-widthで中央寄せ)の右端と、ハンバーガーボタンの右端を揃える */
        #hamburger-btn { right: max(var(--body-pad), calc((100vw - var(--content-width)) / 2)); }
        /* サイドバーと同じ透け方(低めの背景不透明度・弱めの影)に揃える */
        #hamburger-btn {
            background: color-mix(in srgb, var(--bg-color) 5%, transparent) !important;
            backdrop-filter: blur(10px) saturate(190%) !important;
            -webkit-backdrop-filter: blur(10px) saturate(190%) !important;
            box-shadow:
                inset 0 1px 0 color-mix(in srgb, white 25%, transparent),
                0 4px 16px color-mix(in srgb, black 10%, transparent) !important;
        }

        ::selection { background: var(--selection-bg-color); color: var(--selection-text-color); }

        html {
            font-size: calc(var(--base-font-size) * var(--font-size-scale));
            /* トグルを開いてページが長くなりスクロールバーが出現/消滅する瞬間に、
               コンテンツの横位置がずれないよう常にスクロールバー分の余白を確保しておく */
            scrollbar-gutter: stable;
        }

        body {
            /* Tailwind(CDN版)の読み込みを待たずに最低限のレイアウトが効くよう、素のCSSでも指定しておく */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6rem 1.25rem;
            font-family: 'Shippori Mincho', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: calc(var(--base-line-height) * var(--line-height-scale));
            letter-spacing: calc(var(--base-letter-spacing) * var(--letter-spacing-scale));
            opacity: 0;
            transition: opacity 0.4s ease, background-color 0.5s ease, color 0.5s ease;
        }

        body.ready { opacity: 1; }

        @media (min-width: 768px) {
            body { padding-left: 0; padding-right: 0; }
        }

        .fade-in { animation: fadeIn 1.5s ease-out forwards; opacity: 0; transform: translateY(10px); }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        /* ハッシュタグ・SNSシェアアイコン・Subscribeボタン共通のグラスモーフィズム(すりガラス)スタイル */
        .glass-chip {
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            border: 1px solid color-mix(in srgb, currentColor 22%, transparent);
            box-shadow:
                inset 0 1px 0 color-mix(in srgb, white 30%, transparent),
                inset 0 0 0 1px color-mix(in srgb, white 6%, transparent),
                0 4px 18px color-mix(in srgb, black 14%, transparent);
        }
        .glass-icon {
            width: 1.75rem;
            height: 1.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            background: color-mix(in srgb, var(--bg-color) 45%, transparent);
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            border: 1px solid color-mix(in srgb, currentColor 22%, transparent);
            box-shadow:
                inset 0 1px 0 color-mix(in srgb, white 30%, transparent),
                inset 0 0 0 1px color-mix(in srgb, white 6%, transparent),
                0 4px 18px color-mix(in srgb, black 14%, transparent);
        }

        /* シルバー背景の光沢レイヤーを、よく見るとゆっくり動いているくらいの速度でドリフトさせる */
        body.gradient-silver { animation: silverDrift 90s ease-in-out infinite alternate; }
        @keyframes silverDrift {
            0% { background-position: 0 0, 10% 20%, 90% 80%, 0 0; }
            50% { background-position: 0 0, 70% 60%, 30% 40%, 0 0; }
            100% { background-position: 0 0, 20% 90%, 80% 10%, 0 0; }
        }

        /* テスト実装: タイトルに重なる不定形の台形の線。読み込むたびに少し形が変わり、カーソルを乗せて動かすとゆらゆら揺れる。
           不要なら #title-rect-wrap のdivとCSS、JSのsetupTitleRectSway()/randomizeTitleShape()呼び出しを削除すれば元に戻ります */
        .title-rect-wrap { position: absolute; left: 0; z-index: 20; perspective: 500px; }
        .title-rect { width: 100%; height: 100%; overflow: visible; transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1); }
        .title-rect polygon { fill: none; stroke: currentColor; stroke-miterlimit: 10; }

        .article-title { color: var(--text-color-solid); opacity: 0.85; line-height: inherit !important; transition: opacity 0.8s ease, color 0.5s ease; }
        /* コピペした本文の段落タグなどに行間のインラインスタイルが残っていても、必ずサイト設定の行間が効くようにする */
        .content-body, .content-body * { line-height: inherit !important; }
        .group:hover .article-title { opacity: 1; }

        .article-snippet {
            position: relative;
            overflow: hidden;
            max-height: var(--snippet-max-height, 4.8rem);
            transition: max-height 0.55s ease-out, opacity 0.55s ease-out;
            mask-image: linear-gradient(to bottom, black 20%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 20%, transparent 100%);
            opacity: 0.5;
        }

        .open-full { max-height: 2000px; mask-image: none; -webkit-mask-image: none; opacity: 0.9; cursor: text; }

        /* パターンBのLatest本文プレビュー専用(.article-snippetとは別クラスにして、Tailwindのopacity-*
           ユーティリティと組み合わせた際の詳細度の衝突で.open-fullの不透明度が効かなくなる問題を避ける) */
        .latest-snippet {
            position: relative;
            overflow: hidden;
            transition: max-height 0.55s ease-out, opacity 0.55s ease-out;
            mask-image: linear-gradient(to bottom, black 20%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 20%, transparent 100%);
            opacity: 0.7;
        }

        /* 記事と記事の間の細い区切り線(gapの中央あたりに配置) */
        #article-list > article:not(:first-child)::before,
        #tag-article-list > article:not(:first-child)::before {
            content: '';
            position: absolute;
            top: -2rem;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--text-color-solid);
            opacity: 0.15;
        }

        .content-body img { display: block; max-width: 100%; max-height: 70vh; width: auto; height: auto; object-fit: contain; border-radius: 4px; margin: 2em auto; }
        @media (min-width: 768px) {
            .content-body img { margin: 1.1em auto; }
        }
        .content-body blockquote { border-left: 1px solid var(--text-color-solid); padding-left: 1.5em; margin: 2em 0; font-style: italic; opacity: 0.7; }
        .content-body h2 { font-size: 1.2em; margin: 2em 0 1em 0; opacity: 0.9; }
        .footnote-ref { color: var(--footnote-color); text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px; }
        .footnote-ref a { color: inherit; text-decoration: inherit; }
        .footnote-list { margin-top: 2.5em; padding-top: 1.2em; border-top: 1px dotted color-mix(in srgb, currentColor 30%, transparent); font-size: 0.8em; opacity: 0.75; list-style: none; }
        .footnote-list li { display: flex; gap: 0.5em; margin-bottom: 0.6em; }
        .footnote-list li span:first-child { flex-shrink: 0; }
        .footnote-list a.footnote-back { opacity: 0.5; text-decoration: none; margin-left: 0.3em; }
        .search-highlight { background: color-mix(in srgb, var(--tag-bg-color) 55%, transparent); color: var(--tag-text-color); border-radius: 2px; padding: 0 0.1em; }
        /* パターンB(ハブ)のWorkFlowy風アウトライン */
        .outline-toggle { user-select: none; }
        /* 記事一覧の項目間にうっすら区切り線を入れる(最初の項目の上と最後の項目の下には出さない) */
        .outline-article-row + .outline-article-row { border-top: 1px solid color-mix(in srgb, currentColor 12%, transparent); }
    </style>

    <script>
        // SNSシェアなどで使う正規のサイトURL。プレビューデプロイやvercel.appの旧リンクからアクセスしていても、

        // Supabase接続設定(anon keyは公開前提のクライアント用キー・読み取り専用で使用)
        const SUPABASE_URL = 'https://eiyzlawmcyybchxzyozr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpeXpsYXdtY3l5YmNoeHp5b3pyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMDI2MjQsImV4cCI6MjA5NTU3ODYyNH0.SZVwqWKkk31npqdiiG5m3HdkF4JnQ7SgEzThaFfZ4q4';
        // 匿名アクセスは毎回同じ形のリクエストになりがちで、ブラウザ/経路上のキャッシュに古い結果を返されることがあるため、明示的にキャッシュを無効化する
        // また、admin.htmlと同じSupabaseプロジェクト・同じオリジンを使っているため、認証セッションを保持/自動読み込みすると
        // 同じブラウザで管理画面にログイン中は閲覧側もそのセッションを拾ってしまい、下書き・予約投稿まで見えてしまう。
        // このページは常に匿名(anon)としてアクセスすべきなので、セッションの永続化・自動読み込みを無効化する
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
            global: { fetch: (url, options) => fetch(url, { ...options, cache: 'no-store' }) }
        });

        let articles = [];
        let previewLines = 3;
        let siteLineHeight = 2.2;
        let siteFootnoteColor = '#7dd3fc';
        let siteFontSize = 16;
        let siteAboutContent = '';
        let siteSnsXUrl = '';
        let siteSnsInstagramUrl = '';
        let siteSnsWebsiteUrl = '';
        let homepageLayout = 'timeline'; // 'timeline'(パターンA・既定) / 'hub'(パターンB) / 'card'(パターンC)

        const listContainer = document.getElementById('article-list');
        let displayedCount = 0;

        // サイト全体の表示設定(管理画面で設定され、DBの1行に保存されている)を反映する
        async function applySiteSettings() {
            try {
                await applySiteSettingsInner();
            } finally {
                document.body.classList.add('ready');
            }
        }

        // デバッグ用: パターンA/B/Cを手早く切り替えて見比べるための一時的な仕組み。
        // localStorageに上書き保存するだけで、DBのhomepage_layout設定自体は変更しない
        const DEBUG_LAYOUT_CYCLE = ['timeline', 'hub', 'card'];
        const DEBUG_LAYOUT_LABELS = { timeline: 'A', hub: 'B', card: 'C' };

        function initDebugLayoutButton() {
            const override = localStorage.getItem('debugHomepageLayout');
            if (override && DEBUG_LAYOUT_CYCLE.includes(override)) {
                homepageLayout = override;
            }
            const btn = document.getElementById('debug-layout-btn');
            if (btn) btn.textContent = DEBUG_LAYOUT_LABELS[homepageLayout] || 'A';
        }

        async function cycleDebugLayout() {
            const next = DEBUG_LAYOUT_CYCLE[(DEBUG_LAYOUT_CYCLE.indexOf(homepageLayout) + 1) % DEBUG_LAYOUT_CYCLE.length];
            homepageLayout = next;
            localStorage.setItem('debugHomepageLayout', next);
            document.getElementById('debug-layout-btn').textContent = DEBUG_LAYOUT_LABELS[next];
            if (location.pathname.replace(/\/$/, '') !== '') {
                location.href = '/';
                return;
            }
            await loadArticles();
        }

        async function applySiteSettingsInner() {
            const { data, error } = await sb.from('site_settings').select('*').eq('id', 1).single();
            if (error || !data) {
                console.error(error);
                return;
            }
            applyTitleShapeSettings(data);
            document.documentElement.style.setProperty('--bg-color', data.bg_color);
            document.body.classList.remove('gradient-gray', 'gradient-dark', 'gradient-svg', 'gradient-silver',
                'gradient-smooth-1', 'gradient-smooth-2', 'gradient-smooth-3', 'gradient-smooth-4', 'gradient-smooth-5');
            document.body.style.backgroundSize = '';
            document.body.style.backgroundPosition = '';
            if (data.gradient_bg_style === 'silver') {
                // 細かい粒のタイルはそのままに、その下に読み込むたびランダムな向き・位置の
                // 大きく柔らかい金属光沢を2枚重ねることで、単調な一本の帯にならないようにし、
                // タイルの反復感も目立ちにくくする
                document.body.classList.add('gradient-silver');
                const tileImage = getComputedStyle(document.body).backgroundImage;
                const angle1 = Math.round(Math.random() * 360);
                const pos1 = Math.round(25 + Math.random() * 30);
                const angle2 = Math.round(Math.random() * 360);
                const pos2 = Math.round(45 + Math.random() * 30);
                const macroSheen = `linear-gradient(${angle1}deg, rgba(255,255,255,0) 20%, rgba(255,255,255,0.14) ${pos1}%, rgba(255,255,255,0) 65%), linear-gradient(${angle2}deg, rgba(255,255,255,0) 35%, rgba(255,255,255,0.1) ${pos2}%, rgba(255,255,255,0) 80%)`;
                // 全体の暗さは表示設定のスライダー(silver_darkness)で調整できる。単純な半透明の黒を一番上に重ねるだけ
                const darkness = data.silver_darkness != null ? data.silver_darkness : 0.25;
                const darkOverlay = `linear-gradient(rgba(0,0,0,${darkness}), rgba(0,0,0,${darkness}))`;
                document.body.style.backgroundImage = `${darkOverlay}, ${macroSheen}, ${tileImage}`;
                document.body.style.backgroundRepeat = 'no-repeat, no-repeat, no-repeat, repeat';
                document.body.style.backgroundSize = '100% 100%, 220% 220%, 220% 220%, 500px 500px';
                document.body.style.backgroundPosition = '0 0, 10% 20%, 90% 80%, 0 0';
            } else if (data.gradient_bg_style === 'smooth') {
                // canvasでの動的生成(チラつき・継ぎ目・ランダム性の調整で何度も迷走したためやめた)ではなく、
                // あらかじめ作っておいた5パターンの画像から読み込むたびランダムに1枚選ぶだけのシンプルな方式。
                // 当初は実際のページ高さに1枚だけ引き伸ばしていたが、記事が増えて縦に長くなるほど
                // 画面内では変化が見えず単色に見えてしまったため、画像自体を縦方向にシームレスループする
                // よう作り直し、repeat-yで繰り返す方式に変更した(CSSクラス側でbackground-repeat/sizeを指定)
                const variant = 1 + Math.floor(Math.random() * 5);
                document.body.classList.add('gradient-smooth-' + variant);
                document.body.style.backgroundImage = '';
                document.body.style.backgroundRepeat = '';
            } else if (['gray', 'dark', 'svg'].includes(data.gradient_bg_style)) {
                document.body.classList.add('gradient-' + data.gradient_bg_style);
                document.body.style.backgroundImage = '';
                document.body.style.backgroundRepeat = '';
            } else if (data.gradient_bg_style === 'custom' && data.bg_image_url) {
                document.body.style.backgroundImage = `url("${data.bg_image_url}")`;
                document.body.style.backgroundRepeat = 'repeat';
            } else {
                document.body.style.backgroundImage = '';
                document.body.style.backgroundRepeat = '';
            }
            document.documentElement.style.setProperty('--text-color', data.text_color);
            document.documentElement.style.setProperty('--text-color-solid', data.text_color);
            document.documentElement.style.setProperty('--tag-bg-color', data.tag_bg_color || data.text_color);
            document.documentElement.style.setProperty('--tag-text-color', data.tag_text_color || data.bg_color);
            document.documentElement.style.setProperty('--tag-font-size', (data.tag_font_size || 12) + 'px');
            document.documentElement.style.setProperty('--tag-font', data.tag_font || data.font);
            document.documentElement.style.setProperty('--tag-description-color', data.tag_description_color || data.text_color);
            document.documentElement.style.setProperty('--footnote-color', data.footnote_color || data.text_color);
            siteFootnoteColor = data.footnote_color || data.text_color;
            document.documentElement.style.setProperty('--menu-font-size', (data.menu_font_size || 12) + 'px');
            document.documentElement.style.setProperty('--list-heading-bg-color', data.list_heading_bg_color || data.text_color);
            document.documentElement.style.setProperty('--list-heading-text-color', data.list_heading_text_color || data.bg_color);
            document.documentElement.style.setProperty('--tag-description-size', (data.tag_description_size || 12) + 'px');
            document.documentElement.style.setProperty('--selection-bg-color', data.selection_bg_color || data.text_color);
            document.documentElement.style.setProperty('--selection-text-color', data.selection_text_color || data.bg_color);
            document.documentElement.style.setProperty('--subscribe-bg-color', data.subscribe_bg_color || data.text_color);
            document.documentElement.style.setProperty('--subscribe-text-color', data.subscribe_text_color || data.bg_color);
            siteFontSize = data.font_size;
            document.documentElement.style.setProperty('--base-font-size', data.font_size + 'px');
            document.body.style.fontFamily = data.font;
            siteLineHeight = data.line_height;
            document.documentElement.style.setProperty('--base-line-height', data.line_height);
            document.documentElement.style.setProperty('--base-letter-spacing', data.letter_spacing + 'em');
            document.body.style.textAlign = data.text_align || 'left';
            previewLines = data.preview_lines || 3;
            if (data.content_width) document.documentElement.style.setProperty('--content-width', data.content_width + 'px');
            if (data.page_title) document.title = data.page_title;
            const titleEl = document.getElementById('site-title');
            const subtitleEl = document.getElementById('site-subtitle');
            if (data.site_title) titleEl.textContent = data.site_title;
            titleEl.style.fontFamily = data.site_title_font || data.font;
            titleEl.style.fontSize = (data.site_title_size || 14) + 'px';
            titleEl.style.color = data.site_title_color || data.text_color;
            if (data.site_subtitle) subtitleEl.textContent = data.site_subtitle;
            subtitleEl.style.fontSize = (data.site_subtitle_size || 12) + 'px';
            subtitleEl.style.color = data.site_subtitle_color || data.text_color;
            siteAboutContent = data.about_content || '';
            siteSnsXUrl = data.sns_x_url || '';
            siteSnsInstagramUrl = data.sns_instagram_url || '';
            siteSnsWebsiteUrl = data.sns_website_url || '';
            homepageLayout = data.homepage_layout || 'timeline';
            const footerTitle = data.site_title || document.getElementById('site-title').textContent;
            document.getElementById('footer-text').textContent = `© ${new Date().getFullYear()} ${footerTitle}`;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        const SHARE_ICONS = {
            x: '<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M18.9 2h3.1l-7.6 8.7L23 22h-7l-5.4-6.6L4 22H1l8.1-9.3L1 2h7.2l4.9 6.1L18.9 2zm-1.2 18h1.9L7.4 3.9H5.4L17.7 20z"/></svg>',
            facebook: '<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.2c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12z"/></svg>',
            instagram: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="0.6" fill="currentColor" stroke="none"/></svg>',
            share: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><line x1="8.3" y1="10.7" x2="15.7" y2="6.3"/><line x1="8.3" y1="13.3" x2="15.7" y2="17.7"/></svg>',
            website: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><line x1="3" y1="12" x2="21" y2="12"/></svg>'
        };

        // 注釈の色・注釈本文を、DOM挿入前のHTML文字列の時点で確定させる(挿入後にJSで探して書き換える方式は、
        // 実行順序やレンダリング経路によって適用されないことがあったため、生成の起点を一本化した)。
        // 注釈は本文中に埋め込まず、記事の末尾に番号付きでまとめて表示する(参照元は番号リンクのみ)。
        // 同じページに複数の記事が並ぶ(一覧など)ことがあるため、アンカーIDは記事IDで名前空間を分ける
        function applyFootnoteStyling(html, articleId) {
            const container = document.createElement('div');
            container.innerHTML = html;
            const notes = [];
            container.querySelectorAll('.footnote-ref').forEach(el => {
                const next = el.nextElementSibling;
                const noteText = el.dataset.note || (next && next.classList.contains('footnote-note') ? next.textContent : '');
                if (next && next.classList.contains('footnote-note')) next.remove();
                const n = notes.length + 1;
                notes.push(noteText);
                el.id = `fnref-${articleId}-${n}`;
                el.style.setProperty('color', siteFootnoteColor, 'important');
                el.innerHTML = `<a href="#fn-${articleId}-${n}">[${n}]</a>`;
            });
            let notesHtml = '';
            if (notes.length > 0) {
                notesHtml = `<ol class="footnote-list">${notes.map((text, i) => `
                    <li id="fn-${articleId}-${i + 1}"><span style="color:${siteFootnoteColor};">[${i + 1}]</span><span>${escapeHtml(text)}<a href="#fnref-${articleId}-${i + 1}" class="footnote-back">↩</a></span></li>
                `).join('')}</ol>`;
            }
            return container.innerHTML + notesHtml;
        }

        // 実験的機能: 関連記事(共有タグが多い順、なければ表示しない)。不要ならこの関数とbuildArticleHtml内の
        // relatedHtml関連の3行を削除すれば元に戻ります
        function relatedArticles(article, limit) {
            if (!article.tags || article.tags.length === 0) return [];
            const tagIds = new Set(article.tags.map(t => t.id));
            return articles
                .filter(a => a.id !== article.id && a.tags && a.tags.some(t => tagIds.has(t.id)))
                .map(a => ({ article: a, shared: a.tags.filter(t => tagIds.has(t.id)).length }))
                .sort((a, b) => b.shared - a.shared || new Date(b.article.date) - new Date(a.article.date))
                .slice(0, limit)
                .map(x => x.article);
        }

        // 実験的機能: 記事同士の相互リンク(バックリンク)。本文中で他の記事の/article/IDへリンクしておくと、
        // リンクされた側にも「この記事へのリンク」として自動的に表示される(デジタルガーデン的な双方向リンク)。
        // 不要ならこの関数とbuildArticleHtml内のbacklinkHtml関連の3行を削除すれば元に戻ります
        function backlinkArticles(article, limit) {
            const pattern = new RegExp(`/article/${article.id}(?:[^0-9]|$)`);
            return articles.filter(a => a.id !== article.id && pattern.test(a.content)).slice(0, limit);
        }

        function buildArticleHtml(article) {
            // この記事だけの文字組みが設定されていれば、サイト全体の設定を上書きする(行間・頭出し高さはforceLineHeightがJSで適用する)
            let overrideStyle = '';
            if (article.font != null) {
                overrideStyle = `style="font-family:${article.font}; font-size:${article.font_size}px; letter-spacing:${article.letter_spacing}em; text-align:${article.text_align || 'left'};"`;
            }
            const tagsHtml = (article.tags && article.tags.length > 0)
                ? `<div class="flex flex-wrap gap-2 mb-4">${article.tags.map(t => `<a href="/tag/${encodeURIComponent(t.slug)}" onclick="event.stopPropagation()" class="glass-chip px-2 py-0.5 hover:opacity-80 transition-opacity" style="background: color-mix(in srgb, var(--tag-bg-color) 55%, transparent); color: var(--tag-text-color); font-size: var(--tag-font-size); font-family: var(--tag-font);">#${t.name}</a>`).join('')}</div>`
                : '';
            const related = relatedArticles(article, 3);
            const relatedHtml = related.length > 0
                ? `<div class="text-left mb-5"><div class="text-xs opacity-40 mb-2">関連記事</div><div class="flex flex-col gap-1.5">${related.map(a => `<a href="/article/${a.id}" onclick="event.stopPropagation()" class="text-xs opacity-70 hover:opacity-100 transition-opacity">${escapeHtml(a.title)}</a>`).join('')}</div></div>`
                : '';
            const backlinks = backlinkArticles(article, 5);
            const backlinkHtml = backlinks.length > 0
                ? `<div class="text-left mb-5"><div class="text-xs opacity-40 mb-2">この記事へのリンク</div><div class="flex flex-col gap-1.5">${backlinks.map(a => `<a href="/article/${a.id}" onclick="event.stopPropagation()" class="text-xs opacity-70 hover:opacity-100 transition-opacity">${escapeHtml(a.title)}</a>`).join('')}</div></div>`
                : '';
            return `
                <article class="fade-in relative" id="article-${article.id}" data-id="${article.id}" ${overrideStyle}>
                    <div class="cursor-pointer group" onclick="toggleArticle(this, event)">
                        <div class="text-xs opacity-40 mb-2">${article.date}</div>
                        <h2 class="text-lg font-normal mb-4 article-title">${article.title}</h2>
                        ${tagsHtml}
                        <div class="article-snippet text-sm opacity-70 content-body">${applyFootnoteStyling(article.content, article.id)}</div>
                        <div class="mt-4 text-center open-btn">
                            <span class="opacity-30 hover:opacity-100 cursor-pointer transition-opacity" style="font-size: 0.65rem;">↓ 続きを読む</span>
                        </div>
                    </div>
                    <div class="mt-8 text-center hidden close-btn">
                        ${relatedHtml}
                        ${backlinkHtml}
                        <div class="flex items-center justify-center gap-3 mb-4">
                            <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(article.title)}&url=${encodeURIComponent(articleShareUrl(article.id))}" target="_blank" rel="noopener noreferrer" class="glass-icon opacity-70 hover:opacity-100 transition-opacity" title="Xでシェア" aria-label="Xでシェア">${SHARE_ICONS.x}</a>
                            <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(articleShareUrl(article.id))}" target="_blank" rel="noopener noreferrer" class="glass-icon opacity-70 hover:opacity-100 transition-opacity" title="Facebookでシェア" aria-label="Facebookでシェア">${SHARE_ICONS.facebook}</a>
                            <button onclick="shareToInstagram(${article.id})" class="glass-icon opacity-70 hover:opacity-100 transition-opacity" title="リンクをコピー(Instagram用)" aria-label="リンクをコピー(Instagram用)">${SHARE_ICONS.instagram}</button>
                            <button onclick="shareArticle(${article.id})" class="glass-icon opacity-70 hover:opacity-100 transition-opacity" title="共有" aria-label="共有">${SHARE_ICONS.share}</button>
                            <button onclick="event.stopPropagation(); openSubscribeModal()" class="glass-chip hover:opacity-90 transition-opacity px-3 py-1.5 rounded-full" style="background: color-mix(in srgb, var(--subscribe-bg-color) 55%, transparent); color: var(--subscribe-text-color); font-size: 0.65rem;" title="更新をメールで受け取る" aria-label="購読">Subscribe</button>
                        </div>
                        <span class="opacity-30 hover:opacity-100 cursor-pointer transition-opacity" style="font-size: 0.65rem;" onclick="closeArticle(this.parentElement.previousElementSibling)">↑ 閉じる</span>
                    </div>
                </article>`;
        }

        function articleShareUrl(id) {
            return `${SITE_URL}/article/${id}`;
        }

        function shareToInstagram(id) {
            navigator.clipboard.writeText(articleShareUrl(id))
                .then(() => showToast('リンクをコピーしました(Instagramに貼り付けてください)'))
                .catch(() => showToast('コピーに失敗しました'));
        }

        function shareArticle(id) {
            const article = articles.find(a => a.id === id);
            const url = articleShareUrl(id);
            if (navigator.share) {
                navigator.share({ title: article ? article.title : undefined, url }).catch(() => {});
            } else {
                navigator.clipboard.writeText(url)
                    .then(() => showToast('リンクをコピーしました'))
                    .catch(() => showToast('コピーに失敗しました'));
            }
        }

        function renderArticles(count) {
            const items = articles.slice(displayedCount, displayedCount + count);
            items.forEach(article => {
                listContainer.insertAdjacentHTML('beforeend', buildArticleHtml(article));
                forceLineHeight(article, document.getElementById(`article-${article.id}`));
            });
            displayedCount += items.length;
        }

        // 画面幅に応じた行間の倍率(CSSのmedia queryと同じ閾値をJS側でも再現する)
        function currentLineHeightScale() {
            if (window.matchMedia('(max-width: 640px)').matches) return 0.75;
            if (window.matchMedia('(min-width: 1600px)').matches) return 0.9;
            if (window.matchMedia('(min-width: 1280px)').matches) return 0.95;
            if (window.matchMedia('(min-width: 641px) and (max-width: 1023px)').matches) return 0.9;
            return 1;
        }

        function currentFontSizeScale() {
            return window.matchMedia('(max-width: 640px)').matches ? 0.85 : 1;
        }

        // CSSのカスケード(Tailwindのtext-*クラスや、コピペ由来のインラインスタイル)に邪魔されないよう、
        // 本文内の全要素にJSから直接「!important付きの行間」を書き込んで確実に反映する。
        // 頭出し(閉じているときのプレビュー)の高さも、実際に表示されるフォントサイズ・行間に合わせて計算する
        function collapsedSnippetHeightPx(article) {
            const fontSize = (article.font != null ? article.font_size : siteFontSize) * currentFontSizeScale();
            const lineHeight = (article.font != null ? article.line_height : siteLineHeight) * currentLineHeightScale();
            return fontSize * lineHeight * previewLines;
        }

        function forceLineHeight(article, articleEl) {
            if (!articleEl) return;
            const lineHeight = (article.font != null ? article.line_height : siteLineHeight) * currentLineHeightScale();
            articleEl.querySelectorAll('.content-body, .content-body *').forEach(el => {
                el.style.setProperty('line-height', String(lineHeight), 'important');
            });
            // 開いている記事の高さ(インラインstyleでmax-heightを固定しない)は上書きしない
            const snippet = articleEl.querySelector('.article-snippet');
            if (snippet && !snippet.classList.contains('open-full')) {
                snippet.style.maxHeight = collapsedSnippetHeightPx(article) + 'px';
            }
        }

        function reapplyLineHeightToAllArticles() {
            articles.slice(0, displayedCount).forEach(article => {
                forceLineHeight(article, document.getElementById(`article-${article.id}`));
            });
        }

        let lineHeightResizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(lineHeightResizeTimer);
            lineHeightResizeTimer = setTimeout(reapplyLineHeightToAllArticles, 150);
        });

        function getPathArticleId() {
            const m = location.pathname.match(/^\/article\/(\d+)\/?$/);
            return m ? Number(m[1]) : null;
        }

        // 旧形式の共有リンク(#article-数字)も念のため引き続き開けるようにしておく
        function getHashArticleId() {
            const m = location.hash.match(/^#article-(\d+)$/);
            return m ? Number(m[1]) : null;
        }

        function goHome() {
            if (location.pathname.replace(/\/$/, '') === '') {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                location.href = '/';
            }
        }

        function toggleMenu() {
            const panel = document.getElementById('menu-panel');
            const catcher = document.getElementById('menu-catcher');
            const opening = panel.classList.contains('translate-x-full');
            if (opening) {
                catcher.classList.remove('pointer-events-none');
                panel.classList.remove('translate-x-full');
            } else {
                catcher.classList.add('pointer-events-none');
                panel.classList.add('translate-x-full');
            }
        }

        function isListRoute() {
            return location.pathname.replace(/\/$/, '') === '/list';
        }

        function isTagListRoute() {
            return location.pathname.replace(/\/$/, '') === '/tags';
        }

        function isAboutRoute() {
            return location.pathname.replace(/\/$/, '') === '/about';
        }

        function isContactRoute() {
            return location.pathname.replace(/\/$/, '') === '/contact';
        }

        function getTagSlug() {
            const m = location.pathname.match(/^\/tag\/([^/]+)\/?$/);
            return m ? decodeURIComponent(m[1]) : null;
        }

        function isSearchRoute() {
            return location.pathname.replace(/\/$/, '') === '/search';
        }

        // ルートに応じて表示するビューだけを残し、他は隠す
        function hideAllViews() {
            document.getElementById('article-list').classList.add('hidden');
            document.getElementById('hub-view').classList.add('hidden');
            document.getElementById('card-view').classList.add('hidden');
            document.getElementById('title-list-view').classList.add('hidden');
            document.getElementById('about-view').classList.add('hidden');
            document.getElementById('contact-view').classList.add('hidden');
            document.getElementById('tag-view').classList.add('hidden');
            document.getElementById('search-view').classList.add('hidden');
            document.getElementById('loading-indicator').classList.add('hidden');
            document.body.classList.remove('card-home');
            document.getElementById('card-sticky-header').classList.add('hidden');
        }

        function stripHtml(html) {
            const div = document.createElement('div');
            div.innerHTML = html;
            return (div.textContent || '').trim();
        }

        const TITLE_LIST_PAGE_SIZE = 10;
        let titleListCount = TITLE_LIST_PAGE_SIZE;

        // タイトルと日付だけを並べた記事一覧ページ
        async function renderTitleList() {
            hideAllViews();
            const listView = document.getElementById('title-list-view');
            listView.classList.remove('hidden');
            titleListCount = TITLE_LIST_PAGE_SIZE;

            listView.innerHTML = `
                <h2 class="glass-chip self-start inline-block text-sm font-medium px-2 py-0.5 mb-4" style="background: color-mix(in srgb, var(--list-heading-bg-color) 55%, transparent); color: var(--list-heading-text-color);">article</h2>
                <div id="title-rows-container" class="mb-4"></div>
                <div class="text-center mb-16 flex flex-col gap-2">
                    <div id="title-rows-more" class="hidden">
                        <span onclick="showMoreTitleRows()" class="opacity-30 hover:opacity-100 cursor-pointer transition-opacity" style="font-size: 0.65rem;">↓ さらに読み込む</span>
                    </div>
                    <div id="title-rows-close" class="hidden">
                        <span onclick="collapseTitleRows()" class="opacity-30 hover:opacity-100 cursor-pointer transition-opacity" style="font-size: 0.65rem;">↑ 閉じる</span>
                    </div>
                </div>
            `;
            renderTitleRows();
        }

        // ハッシュタグ一覧ページ
        async function renderTagList() {
            hideAllViews();
            const listView = document.getElementById('title-list-view');
            listView.classList.remove('hidden');

            const { data: allTags, error } = await sb.from('tags').select('*').order('name', { ascending: true });
            const tagsHtml = (!error && allTags && allTags.length > 0)
                ? `<div class="flex flex-col gap-4">${allTags.map(t => `
                    <a href="/tag/${encodeURIComponent(t.slug)}" class="block hover:opacity-80 transition-opacity">
                        <span class="glass-chip inline-block px-2 py-0.5" style="background: color-mix(in srgb, var(--tag-bg-color) 55%, transparent); color: var(--tag-text-color); font-size: var(--tag-font-size); font-family: var(--tag-font);">#${t.name}</span>
                        ${t.description ? `<p class="mt-1" style="color: var(--tag-description-color); font-size: var(--tag-description-size); line-height: inherit;">${escapeHtml(t.description)}</p>` : ''}
                    </a>
                `).join('')}</div>`
                : '<p class="text-xs opacity-40">まだタグがありません。</p>';

            listView.innerHTML = `
                <h2 class="glass-chip self-start inline-block text-sm font-medium px-2 py-0.5 mb-4" style="background: color-mix(in srgb, var(--list-heading-bg-color) 55%, transparent); color: var(--list-heading-text-color);">tag</h2>
                ${tagsHtml}
            `;
        }

        // パターンB(ハブ型トップ)用のトップページ。WorkFlowy風に、Article/Tag/About/Contact/Searchの
        // トグルから子(記事タイトル→本文、タグ→該当記事、など)へどんどん展開していく形式。
        // 開閉状態は保持せず、毎回全て閉じた状態から始まる。子要素は初めて開いた時だけ組み立てる(遅延生成)
        let hubTagsCache = null;

        function outlineTopItemHtml(label, kind) {
            return `
                <div class="outline-item">
                    <div class="outline-toggle cursor-pointer py-2 opacity-90 hover:opacity-100 transition-opacity" onclick="toggleOutlineItem(this)" style="font-size: 1.05rem;">
                        <span>${label}</span>
                    </div>
                    <div class="outline-children hidden pb-4" data-kind="${kind}"></div>
                </div>
            `;
        }

        // タイトルに付いているタグを、記事ページ本文と同じ見た目のチップで並べる小さいタグ行(Latestで使用)
        function outlineBulletTagsHtml(article) {
            if (!article.tags || article.tags.length === 0) return '';
            return `
                <div class="flex flex-wrap gap-1.5 mt-1">
                    ${article.tags.map(t => `<a href="/tag/${encodeURIComponent(t.slug)}" onclick="event.stopPropagation()" class="glass-chip px-1.5 py-0.5 hover:opacity-80 transition-opacity" style="background: color-mix(in srgb, var(--tag-bg-color) 55%, transparent); color: var(--tag-text-color); font-size: var(--tag-font-size); font-family: var(--tag-font);">#${escapeHtml(t.name)}</a>`).join('')}
                </div>
            `;
        }

        // タイトルと日付を横並び1行に。タグは表示せず、絞り込み用のdata-tagsとしてのみ持たせる
        // (カテゴリ・タグの絞り込みは一覧の上のフィルター行が担う)。長いタイトルは省略記号で切る
        // カテゴリ名(左) / タイトル(中央、伸縮) / ハッシュタグ(右揃え)を1行に並べる。日付は出さない
        function outlineArticleBulletHtml(article) {
            const tagsAttr = (article.tags || []).map(t => t.slug).join(',');
            const tagsHtml = (article.tags && article.tags.length > 0)
                ? `<span class="flex gap-1.5 flex-shrink-0" style="margin-left: auto;">${article.tags.map(t => `<a href="/tag/${encodeURIComponent(t.slug)}" onclick="event.stopPropagation()" class="glass-chip px-1.5 py-0.5 hover:opacity-80 transition-opacity whitespace-nowrap" style="background: color-mix(in srgb, var(--tag-bg-color) 55%, transparent); color: var(--tag-text-color); font-size: var(--tag-font-size); font-family: var(--tag-font);">#${escapeHtml(t.name)}</a>`).join('')}</span>`
                : '';
            return `
                <div class="outline-item outline-article-row transition-opacity" data-category="${escapeHtml(article.category || '')}" data-tags="${escapeHtml(tagsAttr)}">
                    <div class="outline-toggle flex items-baseline gap-3 cursor-pointer py-2 opacity-80 hover:opacity-100 transition-opacity" onclick="toggleOutlineItem(this)">
                        <span class="opacity-40 whitespace-nowrap flex-shrink-0" style="font-size: 0.65rem; min-width: 3.5em;">${escapeHtml(article.category || '')}</span>
                        <span class="text-sm truncate" style="min-width: 0;">${escapeHtml(article.title)}</span>
                        ${tagsHtml}
                    </div>
                    <div class="outline-children hidden pb-4" data-kind="article-body" data-article-id="${article.id}"></div>
                </div>
            `;
        }

        function outlineTagBulletHtml(tag) {
            return `
                <div class="outline-item">
                    <div class="outline-toggle cursor-pointer py-1.5 opacity-80 hover:opacity-100 transition-opacity" onclick="toggleOutlineItem(this)">
                        <span class="glass-chip inline-block px-2 py-0.5" style="background: color-mix(in srgb, var(--tag-bg-color) 55%, transparent); color: var(--tag-text-color); font-size: var(--tag-font-size); font-family: var(--tag-font);">#${escapeHtml(tag.name)}</span>
                    </div>
                    <div class="outline-children hidden pb-4" style="padding-left: 1.125rem;" data-kind="tag-articles" data-tag-slug="${escapeHtml(tag.slug)}"></div>
                </div>
            `;
        }

        // 記事本文と同じ計算式で文字組み(記事ごとの上書き含む)を再現し、そのまま展開表示する
        function articleOutlineBodyHtml(article) {
            const overrideStyle = article.font != null
                ? `font-family:${article.font}; font-size:${article.font_size}px; letter-spacing:${article.letter_spacing}em; text-align:${article.text_align || 'left'};`
                : '';
            const lineHeight = (article.font != null ? article.line_height : siteLineHeight) * currentLineHeightScale();
            return `
                <div class="content-body text-sm opacity-90" style="${overrideStyle} line-height: ${lineHeight} !important;">${applyFootnoteStyling(article.content, article.id)}</div>
                <a href="/article/${article.id}" class="text-xs opacity-40 hover:opacity-80 transition-opacity mt-3 inline-block">→ ページで開く</a>
            `;
        }

        function outlineSearchBoxHtml() {
            return `
                <input type="text" placeholder="タイトル・本文・タグで検索" oninput="handleOutlineSearchInput(this)" class="w-full max-w-sm bg-transparent border-b text-sm px-2 py-1.5 mb-3 focus:outline-none" style="border-color: color-mix(in srgb, currentColor 30%, transparent);">
                <div class="outline-search-results"></div>
            `;
        }

        function handleOutlineSearchInput(inputEl) {
            const resultsEl = inputEl.nextElementSibling;
            const query = inputEl.value.trim();
            if (!query) {
                resultsEl.innerHTML = '';
                return;
            }
            const results = searchArticles(query);
            resultsEl.innerHTML = results.length > 0
                ? results.map(a => outlineArticleBulletHtml(a)).join('')
                : '<p class="text-xs opacity-40 py-2">見つかりませんでした。</p>';
        }

        // Article/Tagの記事一覧は最初10件だけ表示し、それ以上は「さらに読み込む」ボタンで追加する。
        // 区切り線はボタンと一緒に表示し、全件読み込み終わったら(=ボタンが不要になったら)一緒に消える
        const OUTLINE_PAGE_SIZE = 10;

        function renderOutlinePaginatedList(container, items, emptyMessage) {
            if (items.length === 0) {
                container.innerHTML = `<p class="text-xs opacity-40 py-2">${emptyMessage}</p>`;
                return;
            }
            const shownCount = Number(container.dataset.shownCount || OUTLINE_PAGE_SIZE);
            const visible = items.slice(0, shownCount);
            const moreHtml = items.length > shownCount
                ? `<hr class="my-2" style="border-color: color-mix(in srgb, currentColor 20%, transparent);"><button onclick="expandOutlineList(this)" class="text-xs opacity-30 hover:opacity-100 transition-opacity block">↓ さらに読み込む</button>`
                : '';
            container.innerHTML = visible.map(a => outlineArticleBulletHtml(a)).join('') + moreHtml;
            container.dataset.shownCount = String(shownCount);
            container._outlineItems = items;
        }

        // Articleブランチだけは、全記事を常にフラット表示したまま、カテゴリ(ジャンル)フィルターで
        // 該当するものだけ強調・それ以外を薄くする形式にする(タグと違い1記事につき1カテゴリ)。
        // 一覧性を保ったまま絞り込める見せ方の参考: 一覧は隠さず色の濃淡だけで焦点を変える
        const ARTICLE_CATEGORIES = ['エッセイ', 'ノート', '試論'];

        // カテゴリ(1つだけ選べるジャンル)とタグ(複数選べる横串)は別軸なので、両方の絞り込み条件を
        // 掛け合わせて(AND)判定する。状態はrenderArticleCategoryList()のたびにリセットする
        let outlineActiveCategory = '';
        let outlineActiveTags = new Set();

        function renderArticleCategoryList(container) {
            if (articles.length === 0) {
                container.innerHTML = '<p class="text-xs opacity-40 py-2" style="padding-left: 1.125rem;">まだ記事がありません。</p>';
                return;
            }
            outlineActiveCategory = '';
            outlineActiveTags = new Set();

            // ピン留めされた記事(目安3件程度)を先頭に、それ以外は元の日付順のまま並べる
            const sorted = [...articles].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

            const categoryFilterHtml = ['', ...ARTICLE_CATEGORIES].map(cat => `
                <span class="category-filter-item cursor-pointer transition-opacity hover:opacity-100 ${cat === '' ? 'opacity-90' : 'opacity-50'}" data-category="${escapeHtml(cat)}" onclick="filterArticleCategory(this)">${escapeHtml(cat || 'All')}</span>
            `).join('<span class="opacity-30" style="margin: 0 0.4em;">/</span>');

            const allTags = [...new Map(articles.flatMap(a => a.tags || []).map(t => [t.slug, t])).values()]
                .sort((a, b) => a.name.localeCompare(b.name, 'ja'));
            const tagFilterHtml = allTags.length > 0 ? `
                <div class="tag-filter-row flex flex-wrap gap-2 mb-4">
                    <span class="tag-filter-item glass-chip cursor-pointer px-2 py-0.5 opacity-90 hover:opacity-100 transition-opacity" data-tag="" onclick="filterArticleTag(this)" style="font-size: var(--tag-font-size); font-family: var(--tag-font);">All</span>
                    ${allTags.map(t => `<span class="tag-filter-item glass-chip cursor-pointer px-2 py-0.5 opacity-50 hover:opacity-100 transition-opacity" data-tag="${escapeHtml(t.slug)}" onclick="filterArticleTag(this)" style="background: color-mix(in srgb, var(--tag-bg-color) 55%, transparent); color: var(--tag-text-color); font-size: var(--tag-font-size); font-family: var(--tag-font);">#${escapeHtml(t.name)}</span>`).join('')}
                </div>
            ` : '';

            container.innerHTML = `
                <div style="padding-left: 1.125rem;">
                    <div class="category-filter-row text-sm mb-4">${categoryFilterHtml}</div>
                    ${tagFilterHtml}
                    <div class="category-article-list">${sorted.map(a => outlineArticleBulletHtml(a)).join('')}</div>
                </div>
            `;
        }

        // カテゴリ・タグどちらの状態も踏まえて、一覧全体の絞り込み表示(不透明度)を再計算する
        function applyOutlineArticleFilters(wrapEl) {
            wrapEl.querySelectorAll('.category-article-list > .outline-item[data-category]').forEach(item => {
                const categoryMatch = !outlineActiveCategory || item.dataset.category === outlineActiveCategory;
                const itemTags = (item.dataset.tags || '').split(',').filter(Boolean);
                const tagMatch = outlineActiveTags.size === 0 || itemTags.some(slug => outlineActiveTags.has(slug));
                item.style.opacity = (categoryMatch && tagMatch) ? '' : '0.25';
            });
        }

        function filterArticleCategory(el) {
            const row = el.closest('.category-filter-row');
            row.querySelectorAll('.category-filter-item').forEach(btn => {
                btn.classList.toggle('opacity-90', btn === el);
                btn.classList.toggle('opacity-50', btn !== el);
            });
            outlineActiveCategory = el.dataset.category;
            applyOutlineArticleFilters(row.parentElement);
        }

        // タグは複数選択可(横串の性質上、絞り込みも積み重ねられるようにする)。「All」だけは選択解除の特別扱い
        function filterArticleTag(el) {
            const row = el.closest('.tag-filter-row');
            const value = el.dataset.tag;
            if (value === '') {
                outlineActiveTags.clear();
            } else if (outlineActiveTags.has(value)) {
                outlineActiveTags.delete(value);
            } else {
                outlineActiveTags.add(value);
            }
            const allBtn = row.querySelector('.tag-filter-item[data-tag=""]');
            allBtn.classList.toggle('opacity-90', outlineActiveTags.size === 0);
            allBtn.classList.toggle('opacity-50', outlineActiveTags.size > 0);
            row.querySelectorAll('.tag-filter-item[data-tag]:not([data-tag=""])').forEach(btn => {
                const active = outlineActiveTags.has(btn.dataset.tag);
                btn.classList.toggle('opacity-90', active);
                btn.classList.toggle('opacity-50', !active);
            });
            applyOutlineArticleFilters(row.parentElement);
        }

        function expandOutlineList(btnEl) {
            const container = btnEl.parentElement;
            const items = container._outlineItems || [];
            container.dataset.shownCount = String(Number(container.dataset.shownCount || OUTLINE_PAGE_SIZE) + OUTLINE_PAGE_SIZE);
            renderOutlinePaginatedList(container, items, '');
        }

        // トグルの開閉と、子要素の遅延生成をまとめて担当する
        async function toggleOutlineItem(rowEl) {
            const item = rowEl.parentElement;
            const children = item.querySelector(':scope > .outline-children');
            const isOpen = !children.classList.contains('hidden');
            if (isOpen) {
                children.classList.add('hidden');
                return;
            }
            children.classList.remove('hidden');
            if (children.dataset.loaded === 'true') return;
            children.dataset.loaded = 'true';

            const kind = children.dataset.kind;
            if (kind === 'article-list') {
                renderArticleCategoryList(children);
            } else if (kind === 'article-body') {
                const id = Number(children.dataset.articleId);
                const article = articles.find(a => a.id === id);
                children.innerHTML = article ? articleOutlineBodyHtml(article) : '';
            } else if (kind === 'tag-list') {
                if (!hubTagsCache) {
                    const { data, error } = await sb.from('tags').select('*').order('name', { ascending: true });
                    hubTagsCache = (!error && data) ? data : [];
                }
                const tagListHtml = hubTagsCache.length > 0
                    ? hubTagsCache.map(t => outlineTagBulletHtml(t)).join('')
                    : '<p class="text-xs opacity-40 py-2">まだタグがありません。</p>';
                children.innerHTML = `<div style="padding-left: 1.125rem;">${tagListHtml}</div>`;
            } else if (kind === 'tag-articles') {
                const slug = children.dataset.tagSlug;
                const matched = articles.filter(a => (a.tags || []).some(t => t.slug === slug));
                renderOutlinePaginatedList(children, matched, 'このタグの記事はまだありません。');
            } else if (kind === 'about') {
                children.innerHTML = aboutBodyHtml();
            } else if (kind === 'contact') {
                children.innerHTML = contactBodyHtml();
            } else if (kind === 'search') {
                children.innerHTML = outlineSearchBoxHtml();
            }
        }

        // ハブページ冒頭に常時表示する最新3記事。トグルを開かなくても本文の頭出し(約5行、下端はフェード)まで見え、
        // 続きは記事ページへのリンクで読める(他の一覧項目と違いその場での本文展開はしない)
        const LATEST_PREVIEW_LINES = 5;

        function outlineLatestArticleHtml(article) {
            const lineHeight = (article.font != null ? article.line_height : siteLineHeight) * currentLineHeightScale();
            const maxHeight = latestSnippetMaxHeight(article);
            return `
                <div class="mb-4" data-article-id="${article.id}">
                    <div class="text-sm opacity-90">${escapeHtml(article.title)}</div>
                    ${outlineBulletTagsHtml(article)}
                    <div class="opacity-40 mt-1" style="font-size: 0.65rem;">${escapeHtml(article.date)}</div>
                    <div class="latest-snippet text-sm content-body mt-1" style="line-height: ${lineHeight} !important; max-height: ${maxHeight}px;">${applyFootnoteStyling(article.content, article.id)}</div>
                    <div class="mt-1 text-center">
                        <span class="opacity-30 hover:opacity-100 cursor-pointer transition-opacity latest-open-btn" style="font-size: 0.65rem;" onclick="toggleLatestSnippet(this)">↓ 続きを読む</span>
                        <span class="opacity-30 hover:opacity-100 cursor-pointer transition-opacity latest-close-btn hidden" style="font-size: 0.65rem;" onclick="toggleLatestSnippet(this)">↑ 閉じる</span>
                    </div>
                </div>
            `;
        }

        function latestSnippetMaxHeight(article) {
            const fontSize = (article.font != null ? article.font_size : siteFontSize) * currentFontSizeScale();
            const lineHeight = (article.font != null ? article.line_height : siteLineHeight) * currentLineHeightScale();
            return fontSize * lineHeight * LATEST_PREVIEW_LINES;
        }

        // Latestの本文プレビューを、その場で全文展開/折りたたみする(記事ページへは飛ばない)
        function toggleLatestSnippet(btnEl) {
            const wrap = btnEl.closest('[data-article-id]');
            const snippet = wrap.querySelector('.latest-snippet');
            const openBtn = wrap.querySelector('.latest-open-btn');
            const closeBtn = wrap.querySelector('.latest-close-btn');
            const isOpen = snippet.classList.contains('open-full');
            if (isOpen) {
                snippet.classList.remove('open-full');
                const article = articles.find(a => a.id === Number(wrap.dataset.articleId));
                if (article) snippet.style.maxHeight = latestSnippetMaxHeight(article) + 'px';
                openBtn.classList.remove('hidden');
                closeBtn.classList.add('hidden');
            } else {
                snippet.classList.add('open-full');
                snippet.style.maxHeight = 'none';
                openBtn.classList.add('hidden');
                closeBtn.classList.remove('hidden');
            }
        }

        function renderLatestArticlesHtml() {
            if (articles.length === 0) return '';
            const latest = articles.slice(0, 3);
            return `
                <hr class="my-3" style="border-color: color-mix(in srgb, currentColor 20%, transparent);">
                <div class="mb-2">
                    <div class="opacity-50 text-xs mb-1.5" style="letter-spacing: 0.05em;">Latest</div>
                    ${latest.map(a => outlineLatestArticleHtml(a)).join('')}
                </div>
                <hr class="my-3" style="border-color: color-mix(in srgb, currentColor 20%, transparent);">
            `;
        }

        function renderHubPage() {
            hideAllViews();
            const view = document.getElementById('hub-view');
            view.classList.remove('hidden');
            view.innerHTML = `
                <div class="fade-in">
                    ${renderLatestArticlesHtml()}
                    ${outlineTopItemHtml('About', 'about')}
                    ${outlineTopItemHtml('Article', 'article-list')}
                    ${outlineTopItemHtml('Tag', 'tag-list')}
                    ${outlineTopItemHtml('Contact', 'contact')}
                    ${outlineTopItemHtml('Search', 'search')}
                </div>
            `;
            // サイドバーからの遷移で#article-listのようなハッシュが付いていたら、該当セクションを
            // 自動的に開いてスクロールする(サイドバーのgoToSectionからのクロスページ遷移用)
            const hash = location.hash.replace('#', '');
            if (hash) {
                setTimeout(() => scrollToOutlineSection(hash), 50);
            }
        }

        // パターンBのサイドバーから、ハブページ内の該当セクションへ直接ジャンプする(開いてスクロール)
        function scrollToOutlineSection(kind) {
            const view = document.getElementById('hub-view');
            if (!view) return;
            const childrenEl = view.querySelector(`.outline-children[data-kind="${kind}"]`);
            if (!childrenEl) return;
            const item = childrenEl.closest('.outline-item');
            const row = item.querySelector(':scope > .outline-toggle');
            if (childrenEl.classList.contains('hidden')) {
                toggleOutlineItem(row);
            }
            item.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // パターンBの時だけ、サイドバーのリンクをハブページ内のスクロール移動に差し替える。
        // パターンA(既定)の時は通常通り各ページへ遷移する
        function goToSection(kind, fallbackHref) {
            if (homepageLayout !== 'hub') return true;
            if (location.pathname.replace(/\/$/, '') === '') {
                scrollToOutlineSection(kind);
            } else {
                location.href = '/#' + kind;
            }
            return false;
        }

        // パターンC(カード型トップ)。断片性を強調する見せ方として、記事を1枚1枚のカードにして
        // グリッドで一覧できるようにする。パターンBのArticleブランチと同じ考え方(tystudio.fr/works/を参考にした、
        // 「隠す・並べ替えるのではなく、該当しないものを薄くする」フィルター)をここでも踏襲し、一覧性を保つ。
        // カードは本文プレビューを持たず、タイトル・日付・タグだけを見せて、読むかどうかはクリックして
        // 記事ページ(/article/:id)に飛んでから判断してもらう形にする(パターンA/Bの「その場で読む」とは役割を分ける)
        const CARD_EXCERPT_LENGTH = 220;

        // 本文中で最初に見つかった画像を、カードの表紙として使う(なければ本文の頭出しテキストを詰めて見せる)
        function getFirstImageUrl(html) {
            const m = (html || '').match(/<img[^>]+src="([^"]+)"/i);
            return m ? m[1] : null;
        }

        // カード自体にはハッシュタグを出さず(一覧の情報量を抑える)、タグは絞り込み用のdata-tagsとしてのみ持たせる。
        // 絞り込みは一番上のカテゴリ行+タグ行(renderCardPage)が担う
        // 枠線を引かず、タイトル・本文とも均等組(両端揃え)にすることで、文字組み自体に
        // 見えない枠を感じさせる。画像の有無に関わらずタイトル+本文を同じ文字組みで載せる
        // 本文中にAmazonリンク(amazon.*やamzn.to)が含まれていても、カードの頭出しには出さない。
        // リンクごと取り除いてから地の文を抜き出すので、カードは本文の実際の文章から始まる
        function stripPromoLinksForCard(html) {
            return (html || '').replace(/<a\b[^>]*href="[^"]*(?:amazon\.[a-z.]+|amzn\.to)[^"]*"[^>]*>[\s\S]*?<\/a>/gi, '');
        }

        function articleCardHtml(article) {
            const tagsAttr = (article.tags || []).map(t => t.slug).join(',');
            const imageUrl = getFirstImageUrl(article.content);
            const plainText = stripHtml(stripPromoLinksForCard(article.content));
            const excerpt = plainText.slice(0, CARD_EXCERPT_LENGTH);
            const excerptText = excerpt ? escapeHtml(excerpt) + (plainText.length > CARD_EXCERPT_LENGTH ? '…' : '') : '';

            if (imageUrl) {
                return `
                    <a href="/article/${article.id}" class="article-card article-card-image" data-category="${escapeHtml(article.category || '')}" data-tags="${escapeHtml(tagsAttr)}">
                        <img src="${escapeHtml(imageUrl)}" alt="" loading="lazy" class="card-thumb-full">
                        <div class="card-title" style="font-size: 0.85rem;">${escapeHtml(article.title)}</div>
                        ${excerptText ? `<div class="card-excerpt opacity-90 mt-4">${excerptText}</div>` : ''}
                    </a>
                `;
            }
            return `
                <a href="/article/${article.id}" class="article-card" data-category="${escapeHtml(article.category || '')}" data-tags="${escapeHtml(tagsAttr)}">
                    <div class="card-title opacity-90" style="font-size: 0.85rem;">${escapeHtml(article.title)}</div>
                    ${excerptText ? `<div class="card-excerpt opacity-60 mt-6">${excerptText}</div>` : ''}
                </a>
            `;
        }

        // カテゴリ(1つだけ選べるジャンル)とタグ(複数選べる横串)は別軸なので、両方の絞り込み条件を
        // 掛け合わせて(AND)判定する。状態はrenderCardPage()のたびにリセットする
        let cardActiveCategory = '';
        let cardActiveTags = new Set();

        function renderCardPage() {
            hideAllViews();
            document.body.classList.add('card-home');
            updateCardStickyTitle();
            cardActiveCategory = '';
            cardActiveTags = new Set();
            const view = document.getElementById('card-view');
            view.classList.remove('hidden');
            if (articles.length === 0) {
                view.innerHTML = '<p class="text-xs opacity-40 py-2">まだ記事がありません。</p>';
                return;
            }
            const categoryFilterHtml = ['', ...ARTICLE_CATEGORIES].map(cat => `
                <span class="category-filter-item cursor-pointer transition-opacity hover:opacity-100 ${cat === '' ? 'opacity-90' : 'opacity-50'}" data-category="${escapeHtml(cat)}" onclick="filterCardCategory(this)">${escapeHtml(cat || 'All')}</span>
            `).join('<span class="opacity-30" style="margin: 0 0.4em;">/</span>');

            const allTags = [...new Map(articles.flatMap(a => a.tags || []).map(t => [t.slug, t])).values()]
                .sort((a, b) => a.name.localeCompare(b.name, 'ja'));
            const tagFilterHtml = allTags.length > 0 ? `
                <div class="tag-filter-row flex flex-wrap gap-2 mb-8">
                    <span class="tag-filter-item glass-chip cursor-pointer px-2 py-0.5 opacity-90 hover:opacity-100 transition-opacity" data-tag="" onclick="filterCardTag(this)" style="font-size: var(--tag-font-size); font-family: var(--tag-font);">All</span>
                    ${allTags.map(t => `<span class="tag-filter-item glass-chip cursor-pointer px-2 py-0.5 opacity-50 hover:opacity-100 transition-opacity" data-tag="${escapeHtml(t.slug)}" onclick="filterCardTag(this)" style="background: color-mix(in srgb, var(--tag-bg-color) 55%, transparent); color: var(--tag-text-color); font-size: var(--tag-font-size); font-family: var(--tag-font);">#${escapeHtml(t.name)}</span>`).join('')}
                </div>
            ` : '';

            view.innerHTML = `
                <div class="fade-in">
                    <button id="card-filter-toggle" onclick="toggleCardFilterPanel(this)" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs cursor-pointer hover:opacity-90 transition-opacity mb-6" style="border: 1px solid color-mix(in srgb, white 15%, transparent);">
                        <span>Filter</span>
                        <span id="card-filter-dot" class="hidden" style="width: 5px; height: 5px; border-radius: 9999px; background: currentColor;"></span>
                    </button>
                    <div id="card-filter-panel" class="hidden mb-6">
                        <div class="category-filter-row text-sm mb-4">${categoryFilterHtml}</div>
                        ${tagFilterHtml}
                    </div>
                    <div class="card-grid">${articles.map(a => articleCardHtml(a)).join('')}</div>
                </div>
            `;
        }

        // フィルターボタンを開閉する。カテゴリ/タグどちらかが選ばれている間は、パネルを閉じても
        // ボタンに小さいドットを出して「絞り込み中」であることが分かるようにする
        function toggleCardFilterPanel(btn) {
            document.getElementById('card-filter-panel').classList.toggle('hidden');
        }

        function updateCardFilterIndicator() {
            const dot = document.getElementById('card-filter-dot');
            if (!dot) return;
            dot.classList.toggle('hidden', !cardActiveCategory && cardActiveTags.size === 0);
        }

        // カテゴリ・タグどちらの状態も踏まえて、全カードの絞り込み表示(不透明度)を再計算する
        function applyCardFilters() {
            const grid = document.querySelector('#card-view .card-grid');
            grid.querySelectorAll(':scope > .article-card').forEach(card => {
                const categoryMatch = !cardActiveCategory || card.dataset.category === cardActiveCategory;
                const cardTags = (card.dataset.tags || '').split(',').filter(Boolean);
                const tagMatch = cardActiveTags.size === 0 || cardTags.some(slug => cardActiveTags.has(slug));
                card.style.opacity = (categoryMatch && tagMatch) ? '' : '0.25';
            });
            updateCardFilterIndicator();
        }

        function filterCardCategory(el) {
            const row = el.closest('.category-filter-row');
            row.querySelectorAll('.category-filter-item').forEach(btn => {
                btn.classList.toggle('opacity-90', btn === el);
                btn.classList.toggle('opacity-50', btn !== el);
            });
            cardActiveCategory = el.dataset.category;
            applyCardFilters();
        }

        // タグは複数選択可(横串の性質上、絞り込みも積み重ねられるようにする)。「All」だけは選択解除の特別扱い
        function filterCardTag(el) {
            const row = el.closest('.tag-filter-row');
            const value = el.dataset.tag;
            if (value === '') {
                cardActiveTags.clear();
            } else if (cardActiveTags.has(value)) {
                cardActiveTags.delete(value);
            } else {
                cardActiveTags.add(value);
            }
            const allBtn = row.querySelector('.tag-filter-item[data-tag=""]');
            allBtn.classList.toggle('opacity-90', cardActiveTags.size === 0);
            allBtn.classList.toggle('opacity-50', cardActiveTags.size > 0);
            row.querySelectorAll('.tag-filter-item[data-tag]:not([data-tag=""])').forEach(btn => {
                const active = cardActiveTags.has(btn.dataset.tag);
                btn.classList.toggle('opacity-90', active);
                btn.classList.toggle('opacity-50', !active);
            });
            applyCardFilters();
        }

        function renderTitleRows() {
            const container = document.getElementById('title-rows-container');
            container.innerHTML = articles.slice(0, titleListCount).map(a => `
                <a href="/article/${a.id}" class="flex items-baseline justify-between gap-4 py-4 border-b opacity-70 hover:opacity-100 transition-opacity" style="border-color: color-mix(in srgb, currentColor 30%, transparent);">
                    <span class="text-sm">${a.title}</span>
                    <span class="text-xs opacity-60 whitespace-nowrap">${a.date}</span>
                </a>
            `).join('');
            document.getElementById('title-rows-more').classList.toggle('hidden', titleListCount >= articles.length);
            document.getElementById('title-rows-close').classList.toggle('hidden', titleListCount <= TITLE_LIST_PAGE_SIZE);
        }

        function showMoreTitleRows() {
            titleListCount += TITLE_LIST_PAGE_SIZE;
            renderTitleRows();
        }

        function collapseTitleRows() {
            titleListCount = TITLE_LIST_PAGE_SIZE;
            renderTitleRows();
        }

        // サイト運営者についての自己紹介文+SNSリンク。通常のAboutページと、パターンBのハブの
        // アウトラインの両方から呼べるよう、HTML組み立てを共通の関数にまとめている
        function aboutBodyHtml() {
            const body = siteAboutContent
                ? escapeHtml(siteAboutContent).replace(/\n/g, '<br>')
                : '<p class="opacity-40">まだ内容がありません。</p>';
            // 記事本文と同じ行間になるよう、article本文と同じ計算式で!important付きの行間を直接指定する
            const lineHeight = siteLineHeight * currentLineHeightScale();
            const snsRow = (label, url, icon) => !url ? '' : `
                <div class="flex items-center gap-3">
                    <a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" class="glass-icon shrink-0 opacity-70 hover:opacity-100 transition-opacity" title="${label}" aria-label="${label}">${icon}</a>
                    <div class="min-w-0">
                        <div class="opacity-50" style="font-size: 0.65rem;">${label}</div>
                        <a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" class="hover:opacity-80 transition-opacity block truncate" style="color: ${siteFootnoteColor}; font-size: 0.75rem;">${escapeHtml(url)}</a>
                    </div>
                </div>
            `;
            const snsLinks = [
                snsRow('X', siteSnsXUrl, SHARE_ICONS.x),
                snsRow('Instagram', siteSnsInstagramUrl, SHARE_ICONS.instagram),
                snsRow('Web', siteSnsWebsiteUrl, SHARE_ICONS.website),
            ].filter(Boolean).join('');
            const snsHtml = snsLinks ? `<div class="flex flex-col gap-3 mt-8 fade-in max-w-sm">${snsLinks}</div>` : '';
            return `<div class="text-sm opacity-90 fade-in" style="line-height: ${lineHeight} !important;">${body}</div>${snsHtml}`;
        }

        function renderAboutPage() {
            hideAllViews();
            const view = document.getElementById('about-view');
            view.classList.remove('hidden');
            view.innerHTML = aboutBodyHtml();
        }

        // プライバシーポリシー+お問い合わせフォーム。通常のContactページと、パターンBのハブの
        // アウトラインの両方から呼べるよう、HTML組み立てを共通の関数にまとめている
        let contactPageRenderedAt = 0;

        function contactBodyHtml() {
            contactPageRenderedAt = Date.now();
            return `
                <div class="text-xs opacity-50 fade-in" style="line-height: 1.9;">
                    <h2 class="text-xs opacity-90 mb-3" style="letter-spacing: 0.05em;">プライバシーポリシー</h2>
                    <p>当サイトのニュースレター購読フォームでは、更新通知の送信のみを目的としてメールアドレスをお預かりしています。取得した情報を第三者に提供・販売することはありません。</p>
                    <p class="mt-3">メールの送信にはResend、データの保管にはSupabaseを利用しています。また、文字表示のためGoogle Fontsを読み込んでおり、その際にご利用のブラウザからGoogleのサーバーへ通信が発生します。</p>
                    <p class="mt-3">購読の解除は、配信されたメール内の「配信停止はこちら」リンクからいつでも行えます。解除された時点でメールアドレスは削除されます。取得情報の開示・削除等のご要望は、下記のお問い合わせフォームからご連絡ください。</p>
                </div>
                <div class="mt-10 pt-8 text-xs opacity-90 fade-in" style="border-top: 1px solid currentColor;">
                    <h2 class="text-xs opacity-90 mb-3" style="letter-spacing: 0.05em;">お問い合わせ</h2>
                    <form onsubmit="return submitInquiry(event)" class="flex flex-col gap-3 max-w-sm">
                        <input id="inquiry-email" type="email" required placeholder="you@example.com" class="bg-transparent border-b text-sm px-2 py-1.5 focus:outline-none" style="border-color: color-mix(in srgb, currentColor 30%, transparent);">
                        <textarea id="inquiry-message" required rows="4" placeholder="お問い合わせ内容" class="bg-transparent border rounded text-sm px-2 py-1.5 focus:outline-none resize-none" style="border-color: color-mix(in srgb, currentColor 30%, transparent);"></textarea>
                        <input id="inquiry-hp" type="text" name="url" tabindex="-1" autocomplete="off" aria-hidden="true" style="position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0;">
                        <button type="submit" class="px-3 py-2 text-xs border rounded hover:opacity-70 transition-opacity self-start" style="border-color: color-mix(in srgb, currentColor 30%, transparent);">送信する</button>
                    </form>
                    <p id="inquiry-status" class="text-xs opacity-50 mt-2 hidden"></p>
                </div>
            `;
        }

        function renderContactPage() {
            hideAllViews();
            const view = document.getElementById('contact-view');
            view.classList.remove('hidden');
            view.innerHTML = contactBodyHtml();
        }

        // ハッシュタグ別の一覧ページ(タグ名・説明+該当記事)
        async function renderTagPage(slug) {
            hideAllViews();
            const view = document.getElementById('tag-view');
            view.classList.remove('hidden');

            const { data: tag, error } = await sb.from('tags').select('*').eq('slug', slug).single();
            if (error || !tag) {
                view.innerHTML = `<p class="text-sm opacity-60">このタグは見つかりませんでした。</p>`;
                return;
            }

            const matched = articles.filter(a => (a.tags || []).some(t => t.slug === slug));
            view.innerHTML = `
                <div class="mb-16 fade-in">
                    <h2 class="glass-chip inline-block font-normal mb-3 px-3 py-1" style="background: color-mix(in srgb, var(--tag-bg-color) 55%, transparent); color: var(--tag-text-color); font-size: calc(var(--tag-font-size) * 1.4); font-family: var(--tag-font);">#${tag.name}</h2>
                    ${tag.description ? `<p style="color: var(--tag-description-color); font-size: var(--tag-description-size); line-height: inherit;">${escapeHtml(tag.description)}</p>` : ''}
                </div>
                <div id="tag-article-list" class="flex flex-col gap-16"></div>
            `;
            const tagListContainer = document.getElementById('tag-article-list');
            if (matched.length === 0) {
                tagListContainer.innerHTML = '<p class="text-xs opacity-40">このタグの記事はまだありません。</p>';
                return;
            }
            matched.forEach(article => {
                tagListContainer.insertAdjacentHTML('beforeend', buildArticleHtml(article));
                forceLineHeight(article, document.getElementById(`article-${article.id}`));
            });
        }

        // タイトル・本文・タグ名を対象にした検索
        function searchArticles(query) {
            const q = query.trim().toLowerCase();
            if (!q) return [];
            return articles.filter(a => {
                const haystack = [a.title, stripHtml(a.content), ...(a.tags || []).map(t => t.name)].join(' ').toLowerCase();
                return haystack.includes(q);
            });
        }

        // 一致箇所を<mark>で囲んで目立たせる(タイトルなど全文をそのまま表示する場合)
        function highlightText(text, query) {
            const idx = text.toLowerCase().indexOf(query.toLowerCase());
            if (idx === -1) return escapeHtml(text);
            return escapeHtml(text.slice(0, idx))
                + `<mark class="search-highlight">${escapeHtml(text.slice(idx, idx + query.length))}</mark>`
                + escapeHtml(text.slice(idx + query.length));
        }

        // 本文中の一致箇所の前後だけを抜粋し、一致部分をハイライトする
        function highlightExcerpt(text, query, contextChars) {
            const idx = text.toLowerCase().indexOf(query.toLowerCase());
            if (idx === -1) return '';
            const start = Math.max(0, idx - contextChars);
            const end = Math.min(text.length, idx + query.length + contextChars);
            const before = escapeHtml(text.slice(start, idx));
            const match = escapeHtml(text.slice(idx, idx + query.length));
            const after = escapeHtml(text.slice(idx + query.length, end));
            return (start > 0 ? '…' : '') + before + `<mark class="search-highlight">${match}</mark>` + after + (end < text.length ? '…' : '');
        }

        function renderSearchResults(query) {
            const q = query.trim();
            const meta = document.getElementById('search-meta');
            const container = document.getElementById('search-results');
            if (!q) {
                meta.textContent = '';
                container.innerHTML = '';
                return;
            }
            const results = searchArticles(q);
            if (results.length === 0) {
                meta.textContent = '';
